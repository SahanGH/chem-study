<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="system-ui, sans-serif" font-size="18">
  <!-- Two branches that meet. Left, three boxes with a light accent fill: the temperature change of the solution, q of the solution, q of the reaction, joined by two arrows in the accent color. Right, two hatched boxes: moles of the limiting reactant, moles of reaction, joined by one arrow. Two slanting arrows lead from the bottom of each branch to one last box with a heavy outline, the enthalpy change, with the word "divide" between them. The branches differ in shading (plain fill against hatching) as well as in color. Font size 18 keeps the text at 12 px when the figure is 320 px wide. -->
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6B655D" stroke-width="2" stroke-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="480" height="400" fill="#FDFCF9"/>

  <!-- Left branch: the energy. -->
  <rect x="10" y="20" width="200" height="52" rx="8" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <text x="110" y="52.5" fill="#26231F" text-anchor="middle">ΔT of the solution</text>
  <path d="M50 76V108" fill="none" stroke="#4F706C" stroke-width="2.5"/>
  <path d="M43 106L50 117L57 106Z" fill="#4F706C"/>
  <text x="64" y="102.5" fill="#26231F">× mass × c</text>

  <rect x="10" y="120" width="200" height="52" rx="8" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <text x="110" y="152.5" fill="#26231F" text-anchor="middle">q of the solution</text>
  <path d="M50 176V208" fill="none" stroke="#4F706C" stroke-width="2.5"/>
  <path d="M43 206L50 217L57 206Z" fill="#4F706C"/>
  <text x="64" y="202.5" fill="#26231F">opposite sign, J to kJ</text>

  <rect x="10" y="220" width="200" height="52" rx="8" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <text x="110" y="252.5" fill="#26231F" text-anchor="middle">q of the reaction</text>

  <!-- Right branch: the amount. -->
  <rect x="270" y="100" width="200" height="72" rx="8" fill="#FFFFFF"/>
  <rect x="270" y="100" width="200" height="72" rx="8" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <text x="370" y="131.5" fill="#26231F" text-anchor="middle">Moles of the</text>
  <text x="370" y="153.5" fill="#26231F" text-anchor="middle">limiting reactant</text>
  <path d="M310 176V208" fill="none" stroke="#4F706C" stroke-width="2.5"/>
  <path d="M303 206L310 217L317 206Z" fill="#4F706C"/>
  <text x="324" y="202.5" fill="#26231F">÷ coefficient</text>

  <rect x="270" y="220" width="200" height="52" rx="8" fill="#FFFFFF"/>
  <rect x="270" y="220" width="200" height="52" rx="8" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <text x="370" y="252.5" fill="#26231F" text-anchor="middle">Moles of reaction</text>

  <!-- The meeting: two slanting arrows, and the operation between them. -->
  <path d="M110 276L182.37 321.23" fill="none" stroke="#4F706C" stroke-width="2.5"/>
  <path d="M190 326L179.19 326.32L185.55 316.14Z" fill="#4F706C"/>
  <path d="M370 276L297.63 321.23" fill="none" stroke="#4F706C" stroke-width="2.5"/>
  <path d="M290 326L300.81 326.32L294.45 316.14Z" fill="#4F706C"/>
  <text x="240" y="316" fill="#26231F" text-anchor="middle">divide</text>

  <rect x="120" y="330" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#26231F" stroke-width="3"/>
  <text x="240" y="364.5" fill="#26231F" text-anchor="middle" font-weight="600">ΔH, in kJ/mol</text>
</svg>
