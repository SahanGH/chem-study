<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="system-ui, sans-serif" font-size="18">
  <!-- A heating curve with no numbers. The curve runs through (70, 265), (110, 215), (170, 215), (265, 115), (425, 115), (460, 65): a slope, a flat 60 units long, a gentler slope, a flat 160 units long, a steeper slope. Dashed guides mark the melting point (y = 215) and the boiling point (y = 115). -->
  <rect width="480" height="340" fill="#FDFCF9"/>

  <line x1="70" y1="215" x2="460" y2="215" stroke="#6B655D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="70" y1="115" x2="460" y2="115" stroke="#6B655D" stroke-width="1.5" stroke-dasharray="6 5"/>

  <line x1="70" y1="290" x2="70" y2="30" stroke="#26231F" stroke-width="2"/>
  <line x1="70" y1="290" x2="460" y2="290" stroke="#26231F" stroke-width="2"/>

  <polyline points="70,265 110,215 170,215 265,115 425,115 460,65" fill="none" stroke="#4F706C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="80" y="106" fill="#6B655D">Boiling point</text>
  <text x="456" y="206" text-anchor="end" fill="#6B655D">Melting point</text>

  <text x="102" y="272" fill="#26231F">Solid</text>
  <text x="140" y="241" text-anchor="middle" fill="#26231F">Melting</text>
  <text x="244" y="182" fill="#26231F">Liquid</text>
  <text x="345" y="141" text-anchor="middle" fill="#26231F">Boiling</text>
  <text x="424" y="82" text-anchor="end" fill="#26231F">Gas</text>

  <text x="40" y="160" text-anchor="middle" transform="rotate(-90 40 160)" fill="#26231F">Temperature</text>
  <text x="265" y="322" text-anchor="middle" fill="#26231F">Energy added</text>
</svg>
