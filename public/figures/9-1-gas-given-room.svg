<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" font-family="system-ui, sans-serif" font-size="18">
  <!-- One cylinder drawn twice, closed at x = 30 and open at the right, walls from x = 30 to x = 286 and 100 apart. Upper panel: piston face at x = 150, so the gas has 150 - 30 = 120 units of length. Lower panel: piston face at x = 270, so the gas has 270 - 30 = 240 units, twice the length and twice the volume. The same 10 particles of radius 7 are in each. Rod 130 long and 6 tall, handle 8 wide and 40 tall, both centered on the middle of the cylinder. -->
  <rect width="480" height="310" fill="#FDFCF9"/>
  <text x="240" y="22" text-anchor="middle" fill="#26231F" font-weight="600">Piston pushed in</text>
  <path d="M286 38H30V138H286" fill="none" stroke="#6B655D" stroke-width="3"/>
  <rect x="150" y="38" width="12" height="100" fill="#26231F"/>
  <rect x="162" y="85" width="130" height="6" fill="#26231F"/>
  <rect x="292" y="68" width="8" height="40" fill="#26231F"/>
  <circle cx="48" cy="54" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="78" cy="50" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="108" cy="58" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="134" cy="52" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="60" cy="84" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="92" cy="88" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="124" cy="86" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="50" cy="118" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="84" cy="122" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="118" cy="118" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <text x="240" y="174" text-anchor="middle" fill="#26231F" font-weight="600">Piston pulled out</text>
  <path d="M286 190H30V290H286" fill="none" stroke="#6B655D" stroke-width="3"/>
  <rect x="270" y="190" width="12" height="100" fill="#26231F"/>
  <rect x="282" y="237" width="130" height="6" fill="#26231F"/>
  <rect x="412" y="220" width="8" height="40" fill="#26231F"/>
  <circle cx="52" cy="208" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="104" cy="214" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="150" cy="204" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="204" cy="212" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="250" cy="206" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="70" cy="258" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="122" cy="264" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="172" cy="254" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="220" cy="270" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
  <circle cx="254" cy="256" r="7" fill="#4F706C" stroke="#26231F" stroke-width="1"/>
</svg>
