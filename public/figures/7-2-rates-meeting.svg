<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 332" font-family="system-ui, sans-serif" font-size="18">
  <!-- Plot runs from x=54 (time zero) to x=464 and from y=286 (rate zero) up. The forward rate starts at y=56, 230 units above zero. The two rates meet at y=194, 92 units above zero, which is 40 percent of 230, at x=300, which is 60 percent of the way across. Both curves follow one function g that falls from 1 to 0: forward y = 194 - 138g, reverse y = 194 + 92g, with g(x) = (exp(-3x/246) - exp(-3)) / (1 - exp(-3)) for x measured from time zero, computed every 3 units, and g = 0 from x=300 on. That is the shape for A <=> B, first order each way, starting with A only and ending with 40 percent A; the exponential is shifted and rescaled so that the curves meet exactly at the dashed line. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="332" fill="#FDFCF9"/>

  <path d="M54 30V286H464" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M54 286h-7" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="40" y="292" text-anchor="end" fill="#6B655D">0</text>

  <text x="259" y="318" text-anchor="middle" fill="#26231F">time</text>
  <text x="24" y="158" text-anchor="middle" fill="#26231F" transform="rotate(-90 24 158)">rate</text>

  <!-- Where the rates become equal. -->
  <path d="M300 40V286" fill="none" stroke="#6B655D" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Forward rate: solid, ink. -->
  <path d="M54.0 56.0 L57.0 61.2 L60.0 66.2 L63.0 71.1 L66.0 75.8 L69.0 80.3 L72.0 84.6 L75.0 88.8 L78.0 92.9 L81.0 96.7 L84.0 100.5 L87.0 104.1 L90.0 107.6 L93.0 111.0 L96.0 114.2 L99.0 117.3 L102.0 120.4 L105.0 123.3 L108.0 126.1 L111.0 128.8 L114.0 131.4 L117.0 133.9 L120.0 136.3 L123.0 138.6 L126.0 140.9 L129.0 143.0 L132.0 145.1 L135.0 147.1 L138.0 149.1 L141.0 151.0 L144.0 152.8 L147.0 154.5 L150.0 156.2 L153.0 157.8 L156.0 159.4 L159.0 160.9 L162.0 162.3 L165.0 163.7 L168.0 165.1 L171.0 166.4 L174.0 167.6 L177.0 168.8 L180.0 170.0 L183.0 171.1 L186.0 172.2 L189.0 173.2 L192.0 174.2 L195.0 175.2 L198.0 176.1 L201.0 177.0 L204.0 177.9 L207.0 178.8 L210.0 179.6 L213.0 180.3 L216.0 181.1 L219.0 181.8 L222.0 182.5 L225.0 183.2 L228.0 183.8 L231.0 184.5 L234.0 185.1 L237.0 185.6 L240.0 186.2 L243.0 186.7 L246.0 187.3 L249.0 187.8 L252.0 188.2 L255.0 188.7 L258.0 189.2 L261.0 189.6 L264.0 190.0 L267.0 190.4 L270.0 190.8 L273.0 191.2 L276.0 191.5 L279.0 191.9 L282.0 192.2 L285.0 192.5 L288.0 192.9 L291.0 193.2 L294.0 193.5 L297.0 193.7 L300.0 194.0 L464.0 194.0" fill="none" stroke="#26231F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Reverse rate: dashed, accent. From x=300 on it lies on the forward rate's line. -->
  <path d="M54.0 286.0 L57.0 282.5 L60.0 279.2 L63.0 275.9 L66.0 272.8 L69.0 269.8 L72.0 266.9 L75.0 264.1 L78.0 261.4 L81.0 258.8 L84.0 256.3 L87.0 253.9 L90.0 251.6 L93.0 249.4 L96.0 247.2 L99.0 245.1 L102.0 243.1 L105.0 241.2 L108.0 239.3 L111.0 237.5 L114.0 235.8 L117.0 234.1 L120.0 232.5 L123.0 230.9 L126.0 229.4 L129.0 228.0 L132.0 226.6 L135.0 225.2 L138.0 223.9 L141.0 222.7 L144.0 221.5 L147.0 220.3 L150.0 219.2 L153.0 218.1 L156.0 217.1 L159.0 216.1 L162.0 215.1 L165.0 214.2 L168.0 213.3 L171.0 212.4 L174.0 211.6 L177.0 210.8 L180.0 210.0 L183.0 209.3 L186.0 208.5 L189.0 207.8 L192.0 207.2 L195.0 206.5 L198.0 205.9 L201.0 205.3 L204.0 204.7 L207.0 204.2 L210.0 203.6 L213.0 203.1 L216.0 202.6 L219.0 202.1 L222.0 201.7 L225.0 201.2 L228.0 200.8 L231.0 200.4 L234.0 200.0 L237.0 199.6 L240.0 199.2 L243.0 198.8 L246.0 198.5 L249.0 198.2 L252.0 197.8 L255.0 197.5 L258.0 197.2 L261.0 196.9 L264.0 196.7 L267.0 196.4 L270.0 196.1 L273.0 195.9 L276.0 195.6 L279.0 195.4 L282.0 195.2 L285.0 195.0 L288.0 194.8 L291.0 194.6 L294.0 194.4 L297.0 194.2 L300.0 194.0 L464.0 194.0" fill="none" stroke="#4F706C" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/>

  <text x="68" y="56" fill="#26231F">forward rate</text>
  <text x="104" y="268" fill="#4F706C">reverse rate</text>

  <text x="290" y="100" text-anchor="end" fill="#26231F">forward &gt; reverse:</text>
  <text x="290" y="122" text-anchor="end" fill="#26231F">net change</text>
  <text x="290" y="144" text-anchor="end" fill="#26231F">toward products</text>

  <text x="310" y="122" fill="#26231F">forward = reverse:</text>
  <text x="310" y="144" fill="#26231F">no net change</text>

  <path d="M386 222V200" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <text x="316" y="240" fill="#26231F">equal, and not zero</text>
</svg>
