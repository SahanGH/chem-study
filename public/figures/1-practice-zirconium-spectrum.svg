<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="system-ui, sans-serif" font-size="18">
  <!-- A mass spectrum of five sticks. Plot runs from x=52 (89 amu) to x=382 (97 amu), 41.25 units per amu, with a tick at every whole number. The vertical axis has no numbers: a stick is 4.5 units tall for each percent of relative abundance above y=268, the top edge of the horizontal axis line (centered at y=268.75), so the heights are in exact proportion to the abundances. Sticks are 10 wide, centered on the mass: 90 amu at x=93.25, height 51.5 x 4.5 = 231.75 (top at y=36.25); 91 amu at x=134.5, height 11.2 x 4.5 = 50.4 (top at y=217.6); 92 amu at x=175.75, height 17.1 x 4.5 = 76.95 (top at y=191.05); 94 amu at x=258.25, height 17.4 x 4.5 = 78.3 (top at y=189.7); 96 amu at x=340.75, height 2.8 x 4.5 = 12.6 (top at y=255.4). No stick carries a label. Font size 18 on a width of 400 units is 10.6 px when the figure is drawn 236 px wide, as on a practice page on a 320 px phone. -->
  <rect width="400" height="336" fill="#FDFCF9"/>

  <path d="M52 28V268.75H382" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M52 268.75v7M93.25 268.75v7M134.5 268.75v7M175.75 268.75v7M217 268.75v7M258.25 268.75v7M299.5 268.75v7M340.75 268.75v7M382 268.75v7" fill="none" stroke="#26231F" stroke-width="1.5"/>

  <text x="52" y="296" text-anchor="middle" fill="#6B655D">89</text>
  <text x="93.25" y="296" text-anchor="middle" fill="#6B655D">90</text>
  <text x="134.5" y="296" text-anchor="middle" fill="#6B655D">91</text>
  <text x="175.75" y="296" text-anchor="middle" fill="#6B655D">92</text>
  <text x="217" y="296" text-anchor="middle" fill="#6B655D">93</text>
  <text x="258.25" y="296" text-anchor="middle" fill="#6B655D">94</text>
  <text x="299.5" y="296" text-anchor="middle" fill="#6B655D">95</text>
  <text x="340.75" y="296" text-anchor="middle" fill="#6B655D">96</text>
  <text x="382" y="296" text-anchor="middle" fill="#6B655D">97</text>

  <text x="217" y="326" text-anchor="middle" fill="#26231F">Mass (amu)</text>
  <text x="28" y="148" text-anchor="middle" fill="#26231F" transform="rotate(-90 28 148)">Relative abundance</text>

  <rect x="88.25" y="36.25" width="10" height="231.75" fill="#4F706C"/>
  <rect x="129.5" y="217.6" width="10" height="50.4" fill="#4F706C"/>
  <rect x="170.75" y="191.05" width="10" height="76.95" fill="#4F706C"/>
  <rect x="253.25" y="189.7" width="10" height="78.3" fill="#4F706C"/>
  <rect x="335.75" y="255.4" width="10" height="12.6" fill="#4F706C"/>
</svg>
