<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" font-family="system-ui, sans-serif" font-size="18">
  <!-- A mass spectrum of five sticks. Plot runs from x=72 (89 amu) to x=450 (97 amu), 47.25 units per amu, with a tick at every whole number. The vertical axis has no numbers: a stick is 4.5 units tall for each percent of relative abundance above y=268, the top edge of the horizontal axis line (centered at y=268.75), so the heights are in exact proportion to the abundances. Sticks are 10 wide, centered on the mass: 90 amu at x=119.25, height 51.5 x 4.5 = 231.75 (top at y=36.25); 91 amu at x=166.5, height 11.2 x 4.5 = 50.4 (top at y=217.6); 92 amu at x=213.75, height 17.1 x 4.5 = 76.95 (top at y=191.05); 94 amu at x=308.25, height 17.4 x 4.5 = 78.3 (top at y=189.7); 96 amu at x=402.75, height 2.8 x 4.5 = 12.6 (top at y=255.4). No stick carries a label. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="336" fill="#FDFCF9"/>

  <path d="M72 28V268.75H450" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M72 268.75v7M119.25 268.75v7M166.5 268.75v7M213.75 268.75v7M261 268.75v7M308.25 268.75v7M355.5 268.75v7M402.75 268.75v7M450 268.75v7" fill="none" stroke="#26231F" stroke-width="1.5"/>

  <text x="72" y="296" text-anchor="middle" fill="#6B655D">89</text>
  <text x="119.25" y="296" text-anchor="middle" fill="#6B655D">90</text>
  <text x="166.5" y="296" text-anchor="middle" fill="#6B655D">91</text>
  <text x="213.75" y="296" text-anchor="middle" fill="#6B655D">92</text>
  <text x="261" y="296" text-anchor="middle" fill="#6B655D">93</text>
  <text x="308.25" y="296" text-anchor="middle" fill="#6B655D">94</text>
  <text x="355.5" y="296" text-anchor="middle" fill="#6B655D">95</text>
  <text x="402.75" y="296" text-anchor="middle" fill="#6B655D">96</text>
  <text x="450" y="296" text-anchor="middle" fill="#6B655D">97</text>

  <text x="261" y="326" text-anchor="middle" fill="#26231F">Mass (amu)</text>
  <text x="44" y="148" text-anchor="middle" fill="#26231F" transform="rotate(-90 44 148)">Relative abundance</text>

  <rect x="114.25" y="36.25" width="10" height="231.75" fill="#4F706C"/>
  <rect x="161.5" y="217.6" width="10" height="50.4" fill="#4F706C"/>
  <rect x="208.75" y="191.05" width="10" height="76.95" fill="#4F706C"/>
  <rect x="303.25" y="189.7" width="10" height="78.3" fill="#4F706C"/>
  <rect x="397.75" y="255.4" width="10" height="12.6" fill="#4F706C"/>
</svg>
