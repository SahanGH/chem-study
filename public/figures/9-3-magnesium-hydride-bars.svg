<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" font-family="system-ui, sans-serif" font-size="18">
  <!-- Magnesium hydride giving up its hydrogen, at 298 K and at 700 K. Two panels centered at x = 120 and x = 360, baseline y = 250, 2 units for each kJ. Hatched bar, ΔH° = 75.3 kJ: 2(75.3) = 150.6 tall, top at 250 - 150.6 = 99.4, in both panels. Plain bar, TΔS°: at 298 K, (298)(0.1323) = 39.43 kJ, 78.9 tall, top at 171.1; at 700 K, (700)(0.1323) = 92.61 kJ, 185.2 tall, top at 64.8. Each bar is 60 wide: 70 to 10 left of the center, and 10 to 70 right of it. -->
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#FDFCF9"/>
      <path d="M0 0V7" fill="none" stroke="#6B655D" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="480" height="336" fill="#FDFCF9"/>

  <text x="120" y="28" text-anchor="middle" fill="#26231F">298 K</text>
  <rect x="50" y="99.4" width="60" height="150.6" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="130" y="171.1" width="60" height="78.9" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <line x1="35" y1="250" x2="205" y2="250" stroke="#26231F" stroke-width="1.5"/>
  <text x="80" y="92.4" text-anchor="middle" fill="#26231F">75.3</text>
  <text x="160" y="164.1" text-anchor="middle" fill="#26231F">39.4</text>
  <text x="80" y="272" text-anchor="middle" fill="#26231F">ΔH°</text>
  <text x="160" y="272" text-anchor="middle" fill="#26231F">TΔS°</text>
  <text x="120" y="304" text-anchor="middle" fill="#26231F">ΔG° = +35.9 kJ</text>
  <text x="120" y="328" text-anchor="middle" fill="#26231F">unfavored</text>

  <text x="360" y="28" text-anchor="middle" fill="#26231F">700 K</text>
  <rect x="290" y="99.4" width="60" height="150.6" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="370" y="64.8" width="60" height="185.2" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <line x1="275" y1="250" x2="445" y2="250" stroke="#26231F" stroke-width="1.5"/>
  <text x="320" y="92.4" text-anchor="middle" fill="#26231F">75.3</text>
  <text x="400" y="57.8" text-anchor="middle" fill="#26231F">92.6</text>
  <text x="320" y="272" text-anchor="middle" fill="#26231F">ΔH°</text>
  <text x="400" y="272" text-anchor="middle" fill="#26231F">TΔS°</text>
  <text x="360" y="304" text-anchor="middle" fill="#26231F">ΔG° = −17.3 kJ</text>
  <text x="360" y="328" text-anchor="middle" fill="#26231F">favored</text>
</svg>
