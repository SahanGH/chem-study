<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" font-family="system-ui, sans-serif" font-size="18">
  <!-- The mixture after MnSO4(aq) and Na2CO3(aq) react, drawn wrongly and rightly. Student box: 3 Mn2+ (two of them touching in the solid, mark 3), 1 CO3 2-, 1 C atom and 3 O atoms drawn as four separate atoms, 10 or more apart (mark 2), 3 SO4 2-, 2 Na+ (mark 1). Total charge 0. The marks are small squares, not particles. Corrected box: a solid of 2 Mn2+ and 2 CO3 2- with unlike ions touching, and 1 Mn2+, 3 SO4 2- and 4 Na+ dissolved above. Total charge 0. Water is not drawn. Coordinates from scratchpad/unit4/tools/fig-4-3.cjs. -->
  <defs>
    <g id="mn">
      <circle r="17" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
      <text y="6.5" text-anchor="middle" fill="#FDFCF9">Mn</text>
    </g>
    <g id="na">
      <circle r="17" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
      <text y="6.5" text-anchor="middle" fill="#FDFCF9">Na</text>
    </g>
    <g id="so4">
      <circle r="22" fill="#4F706C" fill-opacity="0.4" stroke="#26231F" stroke-width="1.5"/>
      <text y="6.5" text-anchor="middle" fill="#26231F">SO<tspan dy="4" font-size="14">4</tspan></text>
    </g>
    <g id="co3">
      <circle r="22" fill="#4F706C" fill-opacity="0.4" stroke="#26231F" stroke-width="2" stroke-dasharray="5 4"/>
      <text y="6.5" text-anchor="middle" fill="#26231F">CO<tspan dy="4" font-size="14">3</tspan></text>
    </g>
    <g id="c-atom">
      <circle r="12" fill="#26231F"/>
      <text y="6.5" text-anchor="middle" fill="#FDFCF9">C</text>
    </g>
    <g id="o-atom">
      <circle r="12" fill="#E3EAE9" stroke="#4F706C" stroke-width="1.5"/>
      <text y="6.5" text-anchor="middle" fill="#26231F">O</text>
    </g>
  </defs>
  <rect width="480" height="380" fill="#FDFCF9"/>

  <text x="121" y="26" fill="#26231F" text-anchor="middle" font-weight="600">A student&#8217;s drawing</text>
  <rect x="8" y="38" width="226" height="250" rx="10" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <g id="student">
    <use href="#mn" x="182.3" y="73.3"/>
    <use href="#na" x="59.3" y="82.5"/>
    <use href="#na" x="142" y="97.6"/>
    <use href="#so4" x="55.6" y="133.6"/>
    <use href="#so4" x="188.4" y="150.2"/>
    <use href="#so4" x="126.7" y="152.2"/>
    <use href="#o-atom" x="180.1" y="220"/>
    <use href="#c-atom" x="180.1" y="254"/>
    <use href="#co3" x="40" y="261"/>
    <use href="#mn" x="78.7" y="266"/>
    <use href="#mn" x="112.7" y="266"/>
    <use href="#o-atom" x="150.7" y="271"/>
    <use href="#o-atom" x="209.6" y="271"/>
  </g>
  <g id="marks">
    <rect x="89.7" y="79" width="22" height="22" rx="4" fill="#FDFCF9" stroke="#26231F" stroke-width="2"/>
    <text x="100.7" y="96.5" text-anchor="middle" fill="#26231F" font-weight="700">1</text>
    <rect x="201.1" y="201" width="22" height="22" rx="4" fill="#FDFCF9" stroke="#26231F" stroke-width="2"/>
    <text x="212.1" y="218.5" text-anchor="middle" fill="#26231F" font-weight="700">2</text>
    <rect x="84.7" y="223" width="22" height="22" rx="4" fill="#FDFCF9" stroke="#26231F" stroke-width="2"/>
    <text x="95.7" y="240.5" text-anchor="middle" fill="#26231F" font-weight="700">3</text>
  </g>

  <text x="359" y="26" fill="#26231F" text-anchor="middle" font-weight="600">Corrected</text>
  <rect x="246" y="38" width="226" height="250" rx="10" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <g id="corrected">
    <use href="#na" x="425.8" y="70.5"/>
    <use href="#na" x="325.5" y="72.8"/>
    <use href="#mn" x="277.9" y="89.9"/>
    <use href="#so4" x="383.6" y="98.4"/>
    <use href="#so4" x="329.8" y="123.8"/>
    <use href="#na" x="427.2" y="126.8"/>
    <use href="#so4" x="390.4" y="162.4"/>
    <use href="#na" x="283.6" y="167.4"/>
    <use href="#mn" x="339.5" y="222"/>
    <use href="#co3" x="378.5" y="222"/>
    <use href="#co3" x="339.5" y="261"/>
    <use href="#mn" x="378.5" y="261"/>
  </g>

  <text x="14" y="314" fill="#26231F">1. Too few Na<tspan dy="-7" font-size="14">+</tspan><tspan dy="7">: need two per CO</tspan><tspan dy="4" font-size="14">3</tspan><tspan dy="-11" font-size="14">2&#8722;</tspan></text>
  <text x="14" y="340" fill="#26231F">2. A carbonate drawn as separate atoms</text>
  <text x="14" y="366" fill="#26231F">3. Like charges touch in the solid</text>
</svg>
