<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 590" font-family="system-ui, sans-serif" font-size="18">
  <!-- Three vertical rulers at x = 110, 250 and 390, each from y = 70 to y = 490 with 15 ticks 30 units apart: tick i (0 to 14) is at y = 70 + 30i. Ruler 1 is pH = i. Ruler 2 is [H3O+] = 10^(-i) M. Ruler 3 is [OH-] = 10^(-(14 - i)) M, so in every row the two exponents add to -14. The row i = 7 (y = 280) has a band 28 units tall (y = 266 to 294) from x = 30 to x = 450. Exponents are raised tspans at the full font size of 18. -->
  <rect width="480" height="590" fill="#FDFCF9"/>
  <rect x="30" y="266" width="420" height="28" fill="#E3EAE9"/>

  <g fill="#26231F" text-anchor="middle">
    <text x="110" y="36">pH</text>
    <text x="250" y="36">[H<tspan dy="5">3</tspan><tspan dy="-5">O</tspan><tspan dy="-7">+</tspan><tspan dy="7">] in M</tspan></text>
    <text x="390" y="36">[OH<tspan dy="-7">&#8722;</tspan><tspan dy="7">] in M</tspan></text>
  </g>

  <!-- Ruler: pH. -->
  <line x1="110" y1="70" x2="110" y2="490" stroke="#26231F" stroke-width="2"/>
  <g stroke="#26231F" stroke-width="2">
    <line x1="103" y1="70" x2="117" y2="70"/>
    <line x1="103" y1="100" x2="117" y2="100"/>
    <line x1="103" y1="130" x2="117" y2="130"/>
    <line x1="103" y1="160" x2="117" y2="160"/>
    <line x1="103" y1="190" x2="117" y2="190"/>
    <line x1="103" y1="220" x2="117" y2="220"/>
    <line x1="103" y1="250" x2="117" y2="250"/>
    <line x1="103" y1="280" x2="117" y2="280"/>
    <line x1="103" y1="310" x2="117" y2="310"/>
    <line x1="103" y1="340" x2="117" y2="340"/>
    <line x1="103" y1="370" x2="117" y2="370"/>
    <line x1="103" y1="400" x2="117" y2="400"/>
    <line x1="103" y1="430" x2="117" y2="430"/>
    <line x1="103" y1="460" x2="117" y2="460"/>
    <line x1="103" y1="490" x2="117" y2="490"/>
  </g>
  <g fill="#26231F">
    <text x="124" y="76">0</text>
    <text x="124" y="106">1</text>
    <text x="124" y="136">2</text>
    <text x="124" y="166">3</text>
    <text x="124" y="196">4</text>
    <text x="124" y="226">5</text>
    <text x="124" y="256">6</text>
    <text x="124" y="286">7</text>
    <text x="124" y="316">8</text>
    <text x="124" y="346">9</text>
    <text x="124" y="376">10</text>
    <text x="124" y="406">11</text>
    <text x="124" y="436">12</text>
    <text x="124" y="466">13</text>
    <text x="124" y="496">14</text>
  </g>

  <!-- Ruler: [H3O+]. -->
  <line x1="250" y1="70" x2="250" y2="490" stroke="#26231F" stroke-width="2"/>
  <g stroke="#26231F" stroke-width="2">
    <line x1="243" y1="70" x2="257" y2="70"/>
    <line x1="243" y1="100" x2="257" y2="100"/>
    <line x1="243" y1="130" x2="257" y2="130"/>
    <line x1="243" y1="160" x2="257" y2="160"/>
    <line x1="243" y1="190" x2="257" y2="190"/>
    <line x1="243" y1="220" x2="257" y2="220"/>
    <line x1="243" y1="250" x2="257" y2="250"/>
    <line x1="243" y1="280" x2="257" y2="280"/>
    <line x1="243" y1="310" x2="257" y2="310"/>
    <line x1="243" y1="340" x2="257" y2="340"/>
    <line x1="243" y1="370" x2="257" y2="370"/>
    <line x1="243" y1="400" x2="257" y2="400"/>
    <line x1="243" y1="430" x2="257" y2="430"/>
    <line x1="243" y1="460" x2="257" y2="460"/>
    <line x1="243" y1="490" x2="257" y2="490"/>
  </g>
  <g fill="#26231F">
    <text x="264" y="76">1</text>
    <text x="264" y="106">10<tspan dy="-7">&#8722;1</tspan></text>
    <text x="264" y="136">10<tspan dy="-7">&#8722;2</tspan></text>
    <text x="264" y="166">10<tspan dy="-7">&#8722;3</tspan></text>
    <text x="264" y="196">10<tspan dy="-7">&#8722;4</tspan></text>
    <text x="264" y="226">10<tspan dy="-7">&#8722;5</tspan></text>
    <text x="264" y="256">10<tspan dy="-7">&#8722;6</tspan></text>
    <text x="264" y="286">10<tspan dy="-7">&#8722;7</tspan></text>
    <text x="264" y="316">10<tspan dy="-7">&#8722;8</tspan></text>
    <text x="264" y="346">10<tspan dy="-7">&#8722;9</tspan></text>
    <text x="264" y="376">10<tspan dy="-7">&#8722;10</tspan></text>
    <text x="264" y="406">10<tspan dy="-7">&#8722;11</tspan></text>
    <text x="264" y="436">10<tspan dy="-7">&#8722;12</tspan></text>
    <text x="264" y="466">10<tspan dy="-7">&#8722;13</tspan></text>
    <text x="264" y="496">10<tspan dy="-7">&#8722;14</tspan></text>
  </g>

  <!-- Ruler: [OH-]. -->
  <line x1="390" y1="70" x2="390" y2="490" stroke="#26231F" stroke-width="2"/>
  <g stroke="#26231F" stroke-width="2">
    <line x1="383" y1="70" x2="397" y2="70"/>
    <line x1="383" y1="100" x2="397" y2="100"/>
    <line x1="383" y1="130" x2="397" y2="130"/>
    <line x1="383" y1="160" x2="397" y2="160"/>
    <line x1="383" y1="190" x2="397" y2="190"/>
    <line x1="383" y1="220" x2="397" y2="220"/>
    <line x1="383" y1="250" x2="397" y2="250"/>
    <line x1="383" y1="280" x2="397" y2="280"/>
    <line x1="383" y1="310" x2="397" y2="310"/>
    <line x1="383" y1="340" x2="397" y2="340"/>
    <line x1="383" y1="370" x2="397" y2="370"/>
    <line x1="383" y1="400" x2="397" y2="400"/>
    <line x1="383" y1="430" x2="397" y2="430"/>
    <line x1="383" y1="460" x2="397" y2="460"/>
    <line x1="383" y1="490" x2="397" y2="490"/>
  </g>
  <g fill="#26231F">
    <text x="404" y="76">10<tspan dy="-7">&#8722;14</tspan></text>
    <text x="404" y="106">10<tspan dy="-7">&#8722;13</tspan></text>
    <text x="404" y="136">10<tspan dy="-7">&#8722;12</tspan></text>
    <text x="404" y="166">10<tspan dy="-7">&#8722;11</tspan></text>
    <text x="404" y="196">10<tspan dy="-7">&#8722;10</tspan></text>
    <text x="404" y="226">10<tspan dy="-7">&#8722;9</tspan></text>
    <text x="404" y="256">10<tspan dy="-7">&#8722;8</tspan></text>
    <text x="404" y="286">10<tspan dy="-7">&#8722;7</tspan></text>
    <text x="404" y="316">10<tspan dy="-7">&#8722;6</tspan></text>
    <text x="404" y="346">10<tspan dy="-7">&#8722;5</tspan></text>
    <text x="404" y="376">10<tspan dy="-7">&#8722;4</tspan></text>
    <text x="404" y="406">10<tspan dy="-7">&#8722;3</tspan></text>
    <text x="404" y="436">10<tspan dy="-7">&#8722;2</tspan></text>
    <text x="404" y="466">10<tspan dy="-7">&#8722;1</tspan></text>
    <text x="404" y="496">1</text>
  </g>

  <g fill="#26231F" text-anchor="middle">
    <text x="240" y="530">Shaded row: neutral at 25 °C</text>
    <text x="240" y="564">One step down: [H<tspan dy="5">3</tspan><tspan dy="-5">O</tspan><tspan dy="-7">+</tspan><tspan dy="7">] ÷ 10, [OH</tspan><tspan dy="-7">&#8722;</tspan><tspan dy="7">] × 10</tspan></text>
  </g>
</svg>
