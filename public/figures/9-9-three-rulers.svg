<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="system-ui, sans-serif" font-size="18">
  <!-- Three rulers share one mapping: x = 250 + 600 × E°cell, with E°cell in volts, for n = 2 and T = 298 K.
       Ruler 1 (y = 96), E°cell: a tick every 0.05 V from −0.30 V to +0.30 V, so x = 70, 100, 130, ... 430 (thirteen ticks).
       Ruler 2 (y = 176), ΔG° = −nFE° = −192.97 kJ/mol for each volt, so x = 250 − (600 ÷ 192.97) × ΔG° = 250 − 3.1093 × ΔG°:
       +50: 94.5; +40: 125.6; +30: 156.7; +20: 187.8; +10: 218.9; 0: 250.0; −10: 281.1; −20: 312.2; −30: 343.3; −40: 374.4; −50: 405.5.
       Ruler 3 (y = 256), log K = nFE° ÷ (2.3026 RT) = 33.826 for each volt, so x = 250 + (600 ÷ 33.826) × log K = 250 + 17.738 × log K:
       −10: 72.6; −9: 90.4; −8: 108.1; −7: 125.8; −6: 143.6; −5: 161.3; −4: 179.1; −3: 196.8; −2: 214.5; −1: 232.3; 0: 250.0;
       1: 267.7; 2: 285.5; 3: 303.2; 4: 321.0; 5: 338.7; 6: 356.4; 7: 374.2; 8: 391.9; 9: 409.6; 10: 427.4.
       Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <defs>
    <pattern id="hatch-9-9-three-rulers" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#4F706C" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="480" height="330" fill="#FDFCF9"/>

  <!-- The favored half: tinted and hatched -->
  <rect x="250" y="44" width="190" height="242" fill="#E3EAE9"/>
  <rect x="250" y="44" width="190" height="242" fill="url(#hatch-9-9-three-rulers)"/>

  <text x="250" y="26" text-anchor="middle" fill="#26231F">2 mol of electrons, 298 K</text>

  <!-- The line through 0 V, 0 kJ/mol and K = 1, from y = 44 to y = 286. It is left open where the labels "0", "0" and "1" stand on it. -->
  <path d="M250 44V102M250 126V182M250 206V262M250 284V286" fill="none" stroke="#26231F" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Ruler 1: E°cell -->
  <text x="70" y="70" fill="#26231F">E°cell (V)</text>
  <path d="M70 96H430" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M70 86v10M100 86v10M130 86v10M160 86v10M190 86v10M220 86v10M250 86v10M280 86v10M310 86v10M340 86v10M370 86v10M400 86v10M430 86v10" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="70" y="120" text-anchor="middle" fill="#26231F">−0.30</text>
  <text x="160" y="120" text-anchor="middle" fill="#26231F">−0.15</text>
  <text x="250" y="120" text-anchor="middle" fill="#26231F">0</text>
  <text x="340" y="120" text-anchor="middle" fill="#26231F">+0.15</text>
  <text x="430" y="120" text-anchor="middle" fill="#26231F">+0.30</text>

  <!-- Ruler 2: ΔG° -->
  <text x="70" y="150" fill="#26231F">ΔG° (kJ/mol)</text>
  <path d="M70 176H430" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M94.5 166v10M125.6 166v10M156.7 166v10M187.8 166v10M218.9 166v10M250 166v10M281.1 166v10M312.2 166v10M343.3 166v10M374.4 166v10M405.5 166v10" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="125.6" y="200" text-anchor="middle" fill="#26231F">+40</text>
  <text x="187.8" y="200" text-anchor="middle" fill="#26231F">+20</text>
  <text x="250" y="200" text-anchor="middle" fill="#26231F">0</text>
  <text x="312.2" y="200" text-anchor="middle" fill="#26231F">−20</text>
  <text x="374.4" y="200" text-anchor="middle" fill="#26231F">−40</text>

  <!-- Ruler 3: K, one tick for each power of ten -->
  <text x="70" y="230" font-style="italic" fill="#26231F">K</text>
  <path d="M70 256H430" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M72.6 246v10M161.3 246v10M250 246v10M338.7 246v10M427.4 246v10" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M90.4 250v6M108.1 250v6M125.8 250v6M143.6 250v6M179.1 250v6M196.8 250v6M214.5 250v6M232.3 250v6M267.7 250v6M285.5 250v6M303.2 250v6M321 250v6M356.4 250v6M374.2 250v6M391.9 250v6M409.6 250v6" fill="none" stroke="#26231F" stroke-width="1"/>
  <text x="72.6" y="280" text-anchor="middle" fill="#26231F">10⁻¹⁰</text>
  <text x="161.3" y="280" text-anchor="middle" fill="#26231F">10⁻⁵</text>
  <text x="250" y="280" text-anchor="middle" fill="#26231F">1</text>
  <text x="338.7" y="280" text-anchor="middle" fill="#26231F">10⁵</text>
  <text x="427.4" y="280" text-anchor="middle" fill="#26231F">10¹⁰</text>

  <text x="160" y="314" text-anchor="middle" fill="#6B655D">unfavored</text>
  <text x="340" y="314" text-anchor="middle" fill="#6B655D">favored</text>
</svg>
