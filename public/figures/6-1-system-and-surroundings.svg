<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui, sans-serif" font-size="18">
  <!-- Two panels, each a box labeled system inside a larger box labeled surroundings. Left, exothermic: four arrows point out of the system. Right, endothermic: four arrows point into it. The panels differ in the direction of the arrowheads and in their words, not in color. Each inner box is 90 by 56, centered at (120, 145) and (360, 145). Each arrow is 30 long and 6 from the inner box. -->
  <rect width="480" height="300" fill="#FDFCF9"/>

  <!-- Left panel: exothermic. -->
  <text x="120" y="28" text-anchor="middle" fill="#26231F" font-weight="600">Exothermic</text>
  <rect x="15" y="42" width="210" height="190" rx="10" fill="#E3EAE9" stroke="#6B655D" stroke-width="1.5"/>
  <text x="120" y="66" text-anchor="middle" fill="#26231F">surroundings</text>
  <rect x="75" y="117" width="90" height="56" fill="#FDFCF9" stroke="#26231F" stroke-width="1.5"/>
  <text x="120" y="151.5" text-anchor="middle" fill="#26231F">system</text>
  <!-- up: tail 111, tip 81 -->
  <path d="M120 111V91" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M112 92L120 81L128 92Z" fill="#4F706C"/>
  <!-- down: tail 179, tip 209 -->
  <path d="M120 179V199" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M112 198L120 209L128 198Z" fill="#4F706C"/>
  <!-- left: tail 69, tip 39 -->
  <path d="M69 145H49" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M50 137L39 145L50 153Z" fill="#4F706C"/>
  <!-- right: tail 171, tip 201 -->
  <path d="M171 145H191" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M190 137L201 145L190 153Z" fill="#4F706C"/>
  <text x="120" y="256" text-anchor="middle" fill="#26231F">energy out</text>
  <text x="120" y="280" text-anchor="middle" fill="#26231F">surroundings get warmer</text>

  <!-- Right panel: endothermic. -->
  <text x="360" y="28" text-anchor="middle" fill="#26231F" font-weight="600">Endothermic</text>
  <rect x="255" y="42" width="210" height="190" rx="10" fill="#E3EAE9" stroke="#6B655D" stroke-width="1.5"/>
  <text x="360" y="66" text-anchor="middle" fill="#26231F">surroundings</text>
  <rect x="315" y="117" width="90" height="56" fill="#FDFCF9" stroke="#26231F" stroke-width="1.5"/>
  <text x="360" y="151.5" text-anchor="middle" fill="#26231F">system</text>
  <!-- from above: tail 81, tip 111 -->
  <path d="M360 81V101" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M352 100L360 111L368 100Z" fill="#4F706C"/>
  <!-- from below: tail 209, tip 179 -->
  <path d="M360 209V189" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M352 190L360 179L368 190Z" fill="#4F706C"/>
  <!-- from the left: tail 279, tip 309 -->
  <path d="M279 145H299" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M298 137L309 145L298 153Z" fill="#4F706C"/>
  <!-- from the right: tail 441, tip 411 -->
  <path d="M441 145H421" fill="none" stroke="#4F706C" stroke-width="4"/>
  <path d="M422 137L411 145L422 153Z" fill="#4F706C"/>
  <text x="360" y="256" text-anchor="middle" fill="#26231F">energy in</text>
  <text x="360" y="280" text-anchor="middle" fill="#26231F">surroundings get cooler</text>
</svg>
