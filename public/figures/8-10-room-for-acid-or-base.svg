<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui, sans-serif" font-size="18">
  <!-- Two bar charts. Left panel from x = 20 to 220 (center 120), right panel from x = 260 to 460 (center 360). Baseline at y = 222 in both. Scale: 1 unit for each millimole, so a bar of n mmol has its top at y = 222 − n: 150 mmol gives y = 72 and 50 mmol gives y = 172. Bars are 60 wide: the first from panel left + 30 (x = 50 and 290, centers 80 and 320), the second from panel left + 110 (x = 130 and 370, centers 160 and 400). The number above a bar has its baseline 8 above the bar's top (y = 64 and 164). The name under a bar is at y = 246. The acid form, HA, is hatched in both panels; the base form, A⁻, is plain in both. -->
  <defs>
    <pattern id="hatch-8-10-room" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#FDFCF9"/>
      <path d="M0 0V7" fill="none" stroke="#6B655D" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="#FDFCF9"/>

  <!-- Left panel: 150 mmol of HA, 50 mmol of A⁻ -->
  <text x="120" y="26" text-anchor="middle" fill="#26231F">More acid form</text>
  <rect x="50" y="72" width="60" height="150" fill="url(#hatch-8-10-room)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="130" y="172" width="60" height="50" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <line x1="20" y1="222" x2="220" y2="222" stroke="#26231F" stroke-width="2"/>
  <text x="80" y="64" text-anchor="middle" fill="#26231F">150</text>
  <text x="160" y="164" text-anchor="middle" fill="#26231F">50</text>
  <text x="80" y="246" text-anchor="middle" fill="#26231F">HA</text>
  <text x="160" y="246" text-anchor="middle" fill="#26231F">A⁻</text>
  <text x="120" y="284" text-anchor="middle" fill="#26231F">Room for more OH⁻</text>

  <!-- Right panel: 50 mmol of HA, 150 mmol of A⁻ -->
  <text x="360" y="26" text-anchor="middle" fill="#26231F">More base form</text>
  <rect x="290" y="172" width="60" height="50" fill="url(#hatch-8-10-room)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="370" y="72" width="60" height="150" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <line x1="260" y1="222" x2="460" y2="222" stroke="#26231F" stroke-width="2"/>
  <text x="320" y="164" text-anchor="middle" fill="#26231F">50</text>
  <text x="400" y="64" text-anchor="middle" fill="#26231F">150</text>
  <text x="320" y="246" text-anchor="middle" fill="#26231F">HA</text>
  <text x="400" y="246" text-anchor="middle" fill="#26231F">A⁻</text>
  <text x="360" y="284" text-anchor="middle" fill="#26231F">Room for more H₃O⁺</text>
</svg>
