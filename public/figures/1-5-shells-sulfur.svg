<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="system-ui, sans-serif" font-size="18">
  <!-- A sulfur atom: nucleus at (150, 170); rings of radius 52, 104, 134 carrying 2, 8, 6 electrons, evenly spaced, starting at 0, 22.5, 0 degrees. The tinted disc (radius 118) marks the core. Built by gen-figs.cjs. -->
  <rect width="480" height="340" fill="#FDFCF9"/>

  <!-- The core: the nucleus and the two inner shells. -->
  <circle cx="150" cy="170" r="118" fill="#E3EAE9"/>

  <!-- The three shells. -->
  <g fill="none" stroke="#6B655D" stroke-width="1.5">
    <circle cx="150" cy="170" r="52"/>
    <circle cx="150" cy="170" r="104"/>
    <circle cx="150" cy="170" r="134"/>
  </g>

  <!-- Each ring's name sits on the ring, at the bottom, where no electron is. -->
  <g>
    <rect x="122" y="211" width="56" height="22" fill="#E3EAE9"/>
    <text x="150" y="228.5" text-anchor="middle" fill="#26231F">shell 1</text>
    <rect x="122" y="263" width="56" height="22" fill="#E3EAE9"/>
    <text x="150" y="280.5" text-anchor="middle" fill="#26231F">shell 2</text>
    <rect x="122" y="293" width="56" height="22" fill="#FDFCF9"/>
    <text x="150" y="310.5" text-anchor="middle" fill="#26231F">shell 3</text>
  </g>

  <!-- Nucleus. -->
  <circle cx="150" cy="170" r="22" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
  <text x="150" y="176.5" text-anchor="middle" fill="#FDFCF9">16+</text>

  <!-- 10 core electrons: filled. -->
  <g fill="#26231F">
    <circle cx="202" cy="170" r="7"/>
    <circle cx="98" cy="170" r="7"/>
    <circle cx="246.1" cy="130.2" r="7"/>
    <circle cx="189.8" cy="73.9" r="7"/>
    <circle cx="110.2" cy="73.9" r="7"/>
    <circle cx="53.9" cy="130.2" r="7"/>
    <circle cx="53.9" cy="209.8" r="7"/>
    <circle cx="110.2" cy="266.1" r="7"/>
    <circle cx="189.8" cy="266.1" r="7"/>
    <circle cx="246.1" cy="209.8" r="7"/>
  </g>
  <!-- 6 valence electrons: open, with an accent outline. -->
  <g fill="#FDFCF9" stroke="#4F706C" stroke-width="2.5">
    <circle cx="284" cy="170" r="7"/>
    <circle cx="217" cy="54" r="7"/>
    <circle cx="83" cy="54" r="7"/>
    <circle cx="16" cy="170" r="7"/>
    <circle cx="83" cy="286" r="7"/>
    <circle cx="217" cy="286" r="7"/>
  </g>

  <!-- Leaders and labels. -->
  <path d="M296 110H269.8M296 196H260" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <circle cx="260" cy="196" r="3" fill="#26231F"/>
  <g fill="#26231F">
    <text x="300" y="116.5">valence: 6 electrons</text>
    <text x="300" y="202.5">core: 10 electrons</text>
  </g>
</svg>
