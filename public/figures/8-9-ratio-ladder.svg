<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="system-ui, sans-serif" font-size="18">
  <!-- A ladder of five ratios of base form to acid form. The rungs are to scale: y = 200 - 130 x log(ratio), at 130 units for each pH unit.
       10 : 1, log = +1.00, y = 200 - 130.0 = 70
        3 : 1, log = +0.477, y = 200 - 62.0 = 138
        1 : 1, log = 0, y = 200
        1 : 3, log = -0.477, y = 200 + 62.0 = 262
        1 : 10, log = -1.00, y = 200 + 130.0 = 330
       Rails at x = 190 and x = 290, from y = 50 to y = 350. Each label's baseline is 6 units below its rung, so that the text is centered on the rung's height. The middle rung is in the accent color at twice the stroke width of the others. -->
  <rect width="480" height="400" fill="#FDFCF9"/>

  <!-- Headings. -->
  <g fill="#6B655D">
    <text x="175" y="30" text-anchor="end">base : acid</text>
    <text x="305" y="30">pH</text>
  </g>

  <!-- Rails. -->
  <g stroke="#26231F" stroke-width="3" stroke-linecap="round">
    <line x1="190" y1="50" x2="190" y2="350"/>
    <line x1="290" y1="50" x2="290" y2="350"/>
  </g>

  <!-- Rungs. -->
  <g stroke="#26231F" stroke-width="3">
    <line x1="190" y1="70" x2="290" y2="70"/>
    <line x1="190" y1="138" x2="290" y2="138"/>
    <line x1="190" y1="262" x2="290" y2="262"/>
    <line x1="190" y1="330" x2="290" y2="330"/>
  </g>
  <line x1="190" y1="200" x2="290" y2="200" stroke="#4F706C" stroke-width="6"/>

  <!-- Ratios, on the left. -->
  <g fill="#26231F" text-anchor="end">
    <text x="175" y="76">10 : 1</text>
    <text x="175" y="144">3 : 1</text>
    <text x="175" y="206">1 : 1</text>
    <text x="175" y="268">1 : 3</text>
    <text x="175" y="336">1 : 10</text>
  </g>

  <!-- The pH, on the right. -->
  <g fill="#26231F">
    <text x="305" y="76">pKa + 1.00</text>
    <text x="305" y="144">pKa + 0.48</text>
    <text x="305" y="206">pKa</text>
    <text x="305" y="268">pKa &#8722; 0.48</text>
    <text x="305" y="336">pKa &#8722; 1.00</text>
  </g>
</svg>
