<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui, sans-serif" font-size="18">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4F706C"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="#FDFCF9"/>
  <path d="M30 12V262H466" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="248" y="290" text-anchor="middle" fill="#26231F">reaction progress</text>
  <text x="16" y="137" text-anchor="middle" fill="#26231F" transform="rotate(-90 16 137)">energy</text>

  <!-- Level guides: the top of the hill (y = 43.7) and the reactants' level (y = 150). -->
  <path d="M110 43.7H204.2" fill="none" stroke="#6B655D" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M130 150H430" fill="none" stroke="#6B655D" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- The curve: level at y = 150 from x = 36 to 130 (reactants); the hill through 33 points,
       y = 150 + 65(3u^2 - 2u^3) - 137 sin^2(pi u), u = (x - 130)/160, x = 130, 135, ..., 290;
       level at y = 215 from x = 290 to 456 (products). Top of the hill: (204.2, 43.7),
       106.3 above the reactants; the products are 65 below the reactants. -->
  <polyline points="36,150 130,150.0 135,148.9 140,145.5 145,140.1 150,132.7 155,123.8 160,113.7 165,102.8 170,91.7 175,80.7 180,70.4 185,61.2 190,53.6 195,48.0 200,44.7 205,43.8 210,45.5 215,49.9 220,56.8 225,66.1 230,77.5 235,90.7 240,105.2 245,120.6 250,136.3 255,151.9 260,166.7 265,180.3 270,192.1 275,201.8 280,209.1 285,213.5 290,215.0 456,215" fill="none" stroke="#26231F" stroke-width="3" stroke-linejoin="round"/>

  <!-- "How fast": from the reactants' level (150) up to the top of the hill (43.7), at x = 110. -->
  <path d="M110 97V44.7" fill="none" stroke="#4F706C" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M110 97V147.5" fill="none" stroke="#4F706C" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="60" y="28" fill="#26231F">how fast: kinetics</text>

  <!-- "Which way": from the reactants' level (150) down to the products' level (215), at x = 430. -->
  <path d="M430 182V151" fill="none" stroke="#4F706C" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M430 182V212.5" fill="none" stroke="#4F706C" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="456" y="243" text-anchor="end" fill="#26231F">which way: thermodynamics</text>

  <text x="36" y="174" fill="#26231F">reactants</text>
  <text x="310" y="205" fill="#26231F">products</text>
</svg>
