<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" font-family="system-ui, sans-serif" font-size="18">
  <!-- The photoelectron spectrum of an element to be named. The horizontal axis is logarithmic: 1000 MJ/mol at x=60 and 0.1 MJ/mol at x=382, 80.5 units per decade, so a binding energy E is at x = 60 + 80.5 x (3 - log10 E). The vertical axis has no numbers; a peak is 30 units tall for each electron above y=232, the top edge of the horizontal axis line (centered at y=232.75), so the tallest peak is exactly 3 times as tall as the shortest. Peaks are 4 wide with a rounded top, centered on the binding energy, and each is labeled with its binding energy. Peaks: 126 MJ/mol, x=132.42, height 60 (top at y=172); 9.07 MJ/mol, x=224.41, height 60 (top at y=172); 5.31 MJ/mol, x=243.13, height 180 (top at y=52); 0.74 MJ/mol, x=312.03, height 60 (top at y=172). Font size 18 on a width of 400 units is 10.6 px when the figure is drawn 236 px wide, as on a practice page on a 320 px phone. -->
  <rect width="400" height="308" fill="#FDFCF9"/>

  <path d="M60 36V232.75H382" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M60 232.75v7M140.5 232.75v7M221 232.75v7M301.5 232.75v7M382 232.75v7" fill="none" stroke="#26231F" stroke-width="1.5"/>

  <text x="60" y="258" text-anchor="middle" fill="#6B655D">1000</text>
  <text x="140.5" y="258" text-anchor="middle" fill="#6B655D">100</text>
  <text x="221" y="258" text-anchor="middle" fill="#6B655D">10</text>
  <text x="301.5" y="258" text-anchor="middle" fill="#6B655D">1</text>
  <text x="382" y="258" text-anchor="middle" fill="#6B655D">0.1</text>

  <text x="221" y="288" text-anchor="middle" fill="#26231F">Binding energy (MJ/mol)</text>
  <text x="22" y="134" text-anchor="middle" fill="#26231F" transform="rotate(-90 22 134)">Relative number</text>
  <text x="44" y="134" text-anchor="middle" fill="#26231F" transform="rotate(-90 44 134)">of electrons</text>

  <path d="M130.42 232V174A2 2 0 0 1 134.42 174V232Z" fill="#4F706C"/>
  <path d="M222.41 232V174A2 2 0 0 1 226.41 174V232Z" fill="#4F706C"/>
  <path d="M241.13 232V54A2 2 0 0 1 245.13 54V232Z" fill="#4F706C"/>
  <path d="M310.03 232V174A2 2 0 0 1 314.03 174V232Z" fill="#4F706C"/>

  <text x="132.42" y="164" text-anchor="middle" fill="#26231F">126</text>
  <text x="226.41" y="164" text-anchor="end" fill="#26231F">9.07</text>
  <text x="243.13" y="44" text-anchor="middle" fill="#26231F">5.31</text>
  <text x="312.03" y="164" text-anchor="middle" fill="#26231F">0.74</text>
</svg>
