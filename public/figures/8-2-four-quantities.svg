<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="system-ui, sans-serif" font-size="18">
  <!-- A square of four quantities. Boxes 130 by 50: [H3O+] (40,80)-(170,130); [OH-] (310,80)-(440,130); pH (40,240)-(170,290); pOH (310,240)-(440,290).
       Connectors run box edge to box edge, each drawn 2 units short at both ends so that the arrowheads stop at the boxes:
       top (172,105)-(308,105); bottom (172,265)-(308,265); left (105,132)-(105,238); right (375,132)-(375,238).
       The two side labels sit at y = 178 and y = 208 so that they cannot meet. -->
  <defs>
    <marker id="q-head" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#4F706C"/>
    </marker>
  </defs>
  <rect width="480" height="360" fill="#FDFCF9"/>

  <text x="240" y="44" text-anchor="middle" fill="#26231F">[H₃O⁺][OH⁻] = 1.0 × 10⁻¹⁴ (25 °C)</text>

  <g fill="#E3EAE9" stroke="#26231F" stroke-width="1.5">
    <rect x="40" y="80" width="130" height="50" rx="10"/>
    <rect x="310" y="80" width="130" height="50" rx="10"/>
    <rect x="40" y="240" width="130" height="50" rx="10"/>
    <rect x="310" y="240" width="130" height="50" rx="10"/>
  </g>
  <g fill="#26231F" text-anchor="middle" font-weight="600">
    <text x="105" y="111">[H₃O⁺]</text>
    <text x="375" y="111">[OH⁻]</text>
    <text x="105" y="271">pH</text>
    <text x="375" y="271">pOH</text>
  </g>

  <g stroke="#4F706C" stroke-width="2" fill="none" marker-start="url(#q-head)" marker-end="url(#q-head)">
    <path d="M172 105 L308 105"/>
    <path d="M172 265 L308 265"/>
    <path d="M105 132 L105 238"/>
    <path d="M375 132 L375 238"/>
  </g>

  <text x="117" y="178" fill="#26231F">pH = −log[H₃O⁺]</text>
  <text x="363" y="208" text-anchor="end" fill="#26231F">pOH = −log[OH⁻]</text>

  <text x="240" y="330" text-anchor="middle" fill="#26231F">pH + pOH = 14.00 (25 °C)</text>
</svg>
