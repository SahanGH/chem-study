  <text x="120" y="274" text-anchor="middle" fill="#26231F">photon energy = &#916;<tspan font-style="italic">E</tspan></text>
  <text x="360" y="274" text-anchor="middle" fill="#26231F">photon energy = &#916;<tspan font-style="italic">E</tspan></text>
</svg>
