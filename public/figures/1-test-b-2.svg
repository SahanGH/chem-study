<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="system-ui, sans-serif" font-size="18">
  <!-- A mass spectrum of three sticks. Plot runs from x=52 (107 amu) to x=380 (115 amu), 41 units per amu, with a tick at every whole number. The vertical axis has no numbers: a stick is 2 units tall for each unit of relative abundance above y=268, the top edge of the horizontal axis line (centered at y=268.75), so the heights are in exact proportion to the abundances. Sticks are 10 wide, centered on the mass: 108 amu at x=93, height 60.0 x 2 = 120 (top at y=148); 110 amu at x=175, height 100 x 2 = 200 (top at y=68); 114 amu at x=339, height 40.0 x 2 = 80 (top at y=188). Each stick carries its relative height above it, as the data give it. Font size 18 on a width of 400 units is 10.6 px when the figure is drawn 236 px wide, as on a practice page on a 320 px phone. -->
  <rect width="400" height="336" fill="#FDFCF9"/>

  <path d="M52 28V268.75H380" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M52 268.75v7M93 268.75v7M134 268.75v7M175 268.75v7M216 268.75v7M257 268.75v7M298 268.75v7M339 268.75v7M380 268.75v7" fill="none" stroke="#26231F" stroke-width="1.5"/>

  <text x="52" y="296" text-anchor="middle" fill="#6B655D">107</text>
  <text x="93" y="296" text-anchor="middle" fill="#6B655D">108</text>
  <text x="134" y="296" text-anchor="middle" fill="#6B655D">109</text>
  <text x="175" y="296" text-anchor="middle" fill="#6B655D">110</text>
  <text x="216" y="296" text-anchor="middle" fill="#6B655D">111</text>
  <text x="257" y="296" text-anchor="middle" fill="#6B655D">112</text>
  <text x="298" y="296" text-anchor="middle" fill="#6B655D">113</text>
  <text x="339" y="296" text-anchor="middle" fill="#6B655D">114</text>
  <text x="380" y="296" text-anchor="middle" fill="#6B655D">115</text>

  <text x="216" y="326" text-anchor="middle" fill="#26231F">Mass (amu)</text>
  <text x="28" y="148" text-anchor="middle" fill="#26231F" transform="rotate(-90 28 148)">Relative height</text>

  <rect x="88" y="148" width="10" height="120" fill="#4F706C"/>
  <rect x="170" y="68" width="10" height="200" fill="#4F706C"/>
  <rect x="334" y="188" width="10" height="80" fill="#4F706C"/>

  <text x="93" y="140" text-anchor="middle" fill="#26231F">60.0</text>
  <text x="175" y="60" text-anchor="middle" fill="#26231F">100</text>
  <text x="339" y="180" text-anchor="middle" fill="#26231F">40.0</text>
</svg>
