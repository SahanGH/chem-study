<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="system-ui, sans-serif" font-size="18">
  <!-- Three enthalpy levels for the silicon furnace, to scale at 0.3 units for each kJ: the elements at 0 kJ (y = 70), the products at -221.0 kJ (y = 70 + 66.3 = 136) and the reactants at -910.7 kJ (y = 70 + 273.2 = 343). Two thin dashed arrows fall from the elements, one to each level; one heavy solid arrow in the accent color rises from the reactants to the products. Font size 18 keeps the text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="400" fill="#FDFCF9"/>

  <!-- The axis. -->
  <path d="M40 380V42" fill="none" stroke="#26231F" stroke-width="1.7"/>
  <path d="M34 44L40 30L46 44Z" fill="#26231F"/>
  <text x="24" y="215" fill="#26231F" text-anchor="middle" transform="rotate(-90 24 215)">Enthalpy</text>

  <!-- The elements, at zero. -->
  <path d="M70 70H440" fill="none" stroke="#26231F" stroke-width="2.5"/>
  <text x="255" y="56" fill="#26231F" text-anchor="middle">Elements: Si + 2 C + O₂</text>
  <text x="55" y="76.5" fill="#26231F" text-anchor="middle">0</text>

  <!-- The products, 221.0 kJ below the elements. -->
  <path d="M220 136H440" fill="none" stroke="#26231F" stroke-width="2.5"/>
  <text x="345" y="160" fill="#26231F" text-anchor="middle">Si + 2 CO</text>

  <!-- The reactants, 910.7 kJ below the elements. -->
  <path d="M70 343H290" fill="none" stroke="#26231F" stroke-width="2.5"/>
  <text x="180" y="367" fill="#26231F" text-anchor="middle">SiO₂ + 2 C</text>

  <!-- Formation of the reactants: thin, dashed. -->
  <path d="M110 73V332" fill="none" stroke="#6B655D" stroke-width="1.7" stroke-dasharray="6 5"/>
  <path d="M104 331L110 341L116 331Z" fill="#6B655D"/>
  <text x="122" y="206" fill="#26231F">−910.7 kJ</text>

  <!-- Formation of the products: thin, dashed. -->
  <path d="M400 73V125" fill="none" stroke="#6B655D" stroke-width="1.7" stroke-dasharray="6 5"/>
  <path d="M394 124L400 134L406 124Z" fill="#6B655D"/>
  <text x="388" y="109" fill="#26231F" text-anchor="end">−221.0 kJ</text>

  <!-- The reaction: heavy, solid, upward. -->
  <path d="M255 341V156" fill="none" stroke="#4F706C" stroke-width="6"/>
  <path d="M242 158L255 139L268 158Z" fill="#4F706C"/>
  <text x="272" y="256" fill="#26231F" font-weight="600">ΔH° = +689.7 kJ</text>
</svg>
