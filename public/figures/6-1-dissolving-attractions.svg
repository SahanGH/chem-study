<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" font-family="system-ui, sans-serif" font-size="18">
  <!-- Two bar charts on a baseline at y = 220. In each, a hatched bar (energy in) is made of parts 1 and 2 and a solid bar (energy out) is part 3. Left, exothermic dissolving: in 70 + 30 = 100, out 140. Right, endothermic dissolving: in 110 + 30 = 140, out 100. The bars are sketches for comparison within the figure: no scale, no unit. The two kinds of bar differ in hatching against solid fill, not in color alone. -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FDFCF9"/>
      <path d="M0 0V8" stroke="#6B655D" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect width="480" height="350" fill="#FDFCF9"/>

  <!-- Left panel: exothermic dissolving. -->
  <text x="120" y="28" text-anchor="middle" fill="#26231F" font-weight="600">Exothermic dissolving</text>
  <rect x="45" y="150" width="60" height="70" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="45" y="120" width="60" height="30" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="64" y="173" width="22" height="24" rx="4" fill="#FDFCF9"/>
  <text x="75" y="191.5" text-anchor="middle" fill="#26231F">1</text>
  <rect x="64" y="124" width="22" height="22" rx="4" fill="#FDFCF9"/>
  <text x="75" y="141.5" text-anchor="middle" fill="#26231F">2</text>
  <rect x="135" y="80" width="60" height="140" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
  <text x="165" y="156.5" text-anchor="middle" fill="#FDFCF9">3</text>
  <path d="M35 220H205" fill="none" stroke="#26231F" stroke-width="2"/>
  <text x="75" y="244" text-anchor="middle" fill="#26231F">in</text>
  <text x="165" y="244" text-anchor="middle" fill="#26231F">out</text>
  <text x="120" y="274" text-anchor="middle" fill="#26231F">more out: warms</text>

  <!-- Right panel: endothermic dissolving. -->
  <text x="360" y="28" text-anchor="middle" fill="#26231F" font-weight="600">Endothermic dissolving</text>
  <rect x="285" y="110" width="60" height="110" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="285" y="80" width="60" height="30" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="304" y="153" width="22" height="24" rx="4" fill="#FDFCF9"/>
  <text x="315" y="171.5" text-anchor="middle" fill="#26231F">1</text>
  <rect x="304" y="84" width="22" height="22" rx="4" fill="#FDFCF9"/>
  <text x="315" y="101.5" text-anchor="middle" fill="#26231F">2</text>
  <rect x="375" y="120" width="60" height="100" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
  <text x="405" y="176.5" text-anchor="middle" fill="#FDFCF9">3</text>
  <path d="M275 220H445" fill="none" stroke="#26231F" stroke-width="2"/>
  <text x="315" y="244" text-anchor="middle" fill="#26231F">in</text>
  <text x="405" y="244" text-anchor="middle" fill="#26231F">out</text>
  <text x="360" y="274" text-anchor="middle" fill="#26231F">more in: cools</text>

  <!-- Key. -->
  <rect x="60" y="294" width="16" height="16" fill="url(#hatch)" stroke="#26231F" stroke-width="1.5"/>
  <text x="86" y="308" fill="#26231F">energy in: particles pulled apart</text>
  <rect x="60" y="320" width="16" height="16" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
  <text x="86" y="334" fill="#26231F">energy out: new attractions form</text>
</svg>
