<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" font-family="system-ui, sans-serif" font-size="18">
  <!-- Left: 6 H2S molecules. S radius 18, H radius 11, H centers 27 from the S center, H-S-H angle 92 degrees; no two molecules closer than 22. Right: a 4 x 4 checkerboard, 8 cations (radius 17) and 8 anions (radius 25), neighbors 42 apart so they touch. The dashed outline runs 3.5 inside the edges of one anion and the cation beside it, so it crosses no other ion. -->
  <defs>
    <g id="anion">
      <circle r="25" fill="#E3EAE9" stroke="#6B655D" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" fill="#26231F">&#8722;</text>
    </g>
    <g id="cation">
      <circle r="17" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" fill="#FDFCF9">+</text>
    </g>
  </defs>
  <rect width="480" height="322" fill="#FDFCF9"/>

  <text x="121" y="28" text-anchor="middle" fill="#26231F" font-weight="600">Hydrogen sulfide, H<tspan dy="4" font-size="14">2</tspan><tspan dy="-4">S</tspan></text>
  <rect x="8" y="40" width="226" height="240" rx="10" fill="none" stroke="#6B655D" stroke-width="1.5"/>

  <!-- Hydrogen atoms, drawn under the sulfur atoms they are joined to. -->
  <g fill="#FDFCF9" stroke="#26231F" stroke-width="1.5">
    <circle cx="83.2" cy="96.4" r="11"/>
    <circle cx="44.9" cy="89.7" r="11"/>
    <circle cx="159.3" cy="95.0" r="11"/>
    <circle cx="181.6" cy="63.1" r="11"/>
    <circle cx="65.7" cy="142.4" r="11"/>
    <circle cx="82.1" cy="177.6" r="11"/>
    <circle cx="194.8" cy="157.0" r="11"/>
    <circle cx="161.2" cy="176.5" r="11"/>
    <circle cx="51.1" cy="257.4" r="11"/>
    <circle cx="51.1" cy="218.6" r="11"/>
    <circle cx="156.8" cy="225.6" r="11"/>
    <circle cx="195.1" cy="232.3" r="11"/>
  </g>
  <!-- Sulfur atoms. -->
  <g fill="#E3EAE9" stroke="#26231F" stroke-width="1.5">
    <circle cx="67.3" cy="74.6" r="18"/>
    <circle cx="185.8" cy="89.8" r="18"/>
    <circle cx="56.9" cy="167.9" r="18"/>
    <circle cx="168.6" cy="150.5" r="18"/>
    <circle cx="69.9" cy="238.0" r="18"/>
    <circle cx="172.7" cy="247.4" r="18"/>
  </g>
  <g fill="#26231F" text-anchor="middle">
    <text x="67.3" y="81.1">S</text>
    <text x="185.8" y="96.3">S</text>
    <text x="56.9" y="174.4">S</text>
    <text x="168.6" y="157.0">S</text>
    <text x="69.9" y="244.5">S</text>
    <text x="172.7" y="253.9">S</text>
    <text x="83.2" y="102.9">H</text>
    <text x="44.9" y="96.2">H</text>
    <text x="159.3" y="101.5">H</text>
    <text x="181.6" y="69.6">H</text>
    <text x="65.7" y="148.9">H</text>
    <text x="82.1" y="184.1">H</text>
    <text x="194.8" y="163.5">H</text>
    <text x="161.2" y="183.0">H</text>
    <text x="51.1" y="263.9">H</text>
    <text x="51.1" y="225.1">H</text>
    <text x="156.8" y="232.1">H</text>
    <text x="195.1" y="238.8">H</text>
  </g>
  <text x="121" y="306" text-anchor="middle" fill="#26231F">separate molecules</text>

  <text x="359" y="28" text-anchor="middle" fill="#26231F" font-weight="600">Potassium bromide, KBr</text>
  <rect x="246" y="40" width="226" height="240" rx="10" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <use href="#anion" x="296" y="82"/>
  <use href="#cation" x="338" y="82"/>
  <use href="#anion" x="380" y="82"/>
  <use href="#cation" x="422" y="82"/>
  <use href="#cation" x="296" y="124"/>
  <use href="#anion" x="338" y="124"/>
  <use href="#cation" x="380" y="124"/>
  <use href="#anion" x="422" y="124"/>
  <use href="#anion" x="296" y="166"/>
  <use href="#cation" x="338" y="166"/>
  <use href="#anion" x="380" y="166"/>
  <use href="#cation" x="422" y="166"/>
  <use href="#cation" x="296" y="208"/>
  <use href="#anion" x="338" y="208"/>
  <use href="#cation" x="380" y="208"/>
  <use href="#anion" x="422" y="208"/>

  <!-- One formula unit: a pale line under the dashes keeps them visible on the dark cation. -->
  <path d="M342.1 186.9L382.6 194.7A13.5 13.5 0 0 1 382.6 221.3L342.1 229.1A21.5 21.5 0 1 1 342.1 186.9Z" fill="none" stroke="#FDFCF9" stroke-width="4.5"/>
  <path d="M342.1 186.9L382.6 194.7A13.5 13.5 0 0 1 382.6 221.3L342.1 229.1A21.5 21.5 0 1 1 342.1 186.9Z" fill="none" stroke="#26231F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M359 227V246" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="359" y="264" text-anchor="middle" fill="#26231F">one formula unit</text>
  <text x="359" y="306" text-anchor="middle" fill="#26231F">ions in a 1 : 1 ratio</text>
</svg>
