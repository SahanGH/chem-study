<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="system-ui, sans-serif" font-size="18">
  <!-- The chain of Faraday's law: five boxes in one column, joined by four arrows that point down, each arrow with its operation written to its right.
       Boxes: 230 wide (x = 20 to 250) and 52 tall, tops at y = 20, 126, 232, 338, 444 (20 + 106k), so each gap is 106 - 52 = 54 units.
       Box text: centered at x = 20 + 230/2 = 135, baseline at top + 32 (y = 52, 158, 264, 370, 476).
       Arrows: at x = 135, from the bottom of a box (y = 72, 178, 284, 390) to 6 units above the next box (y = 120, 226, 332, 438);
       the line stops 9 units short of the tip, and the filled head covers the last 10 units.
       Arrow labels: left-aligned at x = 152, baselines at y = 102, 208, 314, 420 (middle of each arrow, 96 + 106k, plus 6 for the text's half height). -->
  <rect width="480" height="500" fill="#FDFCF9"/>

  <g fill="#E3EAE9" stroke="#26231F" stroke-width="1.5">
    <rect x="20" y="20" width="230" height="52" rx="6"/>
    <rect x="20" y="126" width="230" height="52" rx="6"/>
    <rect x="20" y="232" width="230" height="52" rx="6"/>
    <rect x="20" y="338" width="230" height="52" rx="6"/>
    <rect x="20" y="444" width="230" height="52" rx="6"/>
  </g>

  <g fill="#26231F" text-anchor="middle">
    <text x="135" y="52">Current and time</text>
    <text x="135" y="158">Charge (C)</text>
    <text x="135" y="264">Moles of electrons</text>
    <text x="135" y="370">Moles of substance</text>
    <text x="135" y="476">Mass (g)</text>
  </g>

  <g stroke="#26231F" stroke-width="1.7" stroke-linecap="butt">
    <line x1="135" y1="72" x2="135" y2="111"/>
    <line x1="135" y1="178" x2="135" y2="217"/>
    <line x1="135" y1="284" x2="135" y2="323"/>
    <line x1="135" y1="390" x2="135" y2="429"/>
  </g>
  <g fill="#26231F">
    <path d="M129 110H141L135 120z"/>
    <path d="M129 216H141L135 226z"/>
    <path d="M129 322H141L135 332z"/>
    <path d="M129 428H141L135 438z"/>
  </g>

  <g fill="#6B655D">
    <text x="152" y="102">× time, in seconds</text>
    <text x="152" y="208">÷ 96,485 C/mol</text>
    <text x="152" y="314">ratio from the half-reaction</text>
    <text x="152" y="420">× molar mass</text>
  </g>
</svg>
