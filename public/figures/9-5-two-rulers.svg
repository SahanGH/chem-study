<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="system-ui, sans-serif" font-size="18">
  <!-- Both rulers share one mapping: x = 240 + (20/3) × ΔG°, with ΔG° in kJ/mol, so −30 kJ is at x = 40 and +30 kJ at x = 440.
       Upper ruler (y = 100): ticks at ΔG° = −30, −20, −10, 0, +10, +20, +30, so x = 40.0, 106.7, 173.3, 240.0, 306.7, 373.3, 440.0.
       Lower ruler (y = 200): the tick for K = 10^n is at ΔG° = −5.7048n kJ (5.7048 = 2.3026 × 8.314 × 298 ÷ 1,000), so x = 240 − 38.03n:
       n = 5: 49.8; 4: 87.9; 3: 125.9; 2: 163.9; 1: 202.0; 0: 240.0; −1: 278.0; −2: 316.1; −3: 354.1; −4: 392.1; −5: 430.2.
       Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="300" fill="#FDFCF9"/>

  <text x="240" y="28" text-anchor="middle" font-weight="600" fill="#26231F">At 298 K</text>
  <text x="240" y="54" text-anchor="middle" fill="#26231F">ΔG° in kJ/mol</text>

  <!-- Guides: ten thin dashed lines and one solid line joining ΔG° = 0 to K = 1 -->
  <path d="M49.8 100V200M87.9 100V200M125.9 100V200M163.9 100V200M202 100V200M278 100V200M316.1 100V200M354.1 100V200M392.1 100V200M430.2 100V200" fill="none" stroke="#6B655D" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M240 100V200" fill="none" stroke="#26231F" stroke-width="2"/>

  <!-- Upper ruler -->
  <path d="M40 100H440" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M40 90v10M106.7 90v10M173.3 90v10M240 90v10M306.7 90v10M373.3 90v10M440 90v10" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="40" y="82" text-anchor="middle" fill="#26231F">−30</text>
  <text x="106.7" y="82" text-anchor="middle" fill="#26231F">−20</text>
  <text x="173.3" y="82" text-anchor="middle" fill="#26231F">−10</text>
  <text x="240" y="82" text-anchor="middle" fill="#26231F">0</text>
  <text x="306.7" y="82" text-anchor="middle" fill="#26231F">+10</text>
  <text x="373.3" y="82" text-anchor="middle" fill="#26231F">+20</text>
  <text x="440" y="82" text-anchor="middle" fill="#26231F">+30</text>

  <!-- Lower ruler -->
  <path d="M40 200H440" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M49.8 200v10M87.9 200v10M125.9 200v10M163.9 200v10M202 200v10M240 200v10M278 200v10M316.1 200v10M354.1 200v10M392.1 200v10M430.2 200v10" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="87.9" y="232" text-anchor="middle" fill="#26231F">10⁴</text>
  <text x="163.9" y="232" text-anchor="middle" fill="#26231F">10²</text>
  <text x="240" y="232" text-anchor="middle" fill="#26231F">1</text>
  <text x="316.1" y="232" text-anchor="middle" fill="#26231F">10⁻²</text>
  <text x="392.1" y="232" text-anchor="middle" fill="#26231F">10⁻⁴</text>
  <text x="240" y="258" text-anchor="middle" font-style="italic" fill="#26231F">K</text>

  <!-- Label on a backing rectangle that covers the three dashed guides behind it -->
  <rect x="282" y="136" width="144" height="28" fill="#FDFCF9"/>
  <text x="354" y="156" text-anchor="middle" fill="#4F706C">×10 every 5.7 kJ</text>

  <text x="140" y="288" text-anchor="middle" fill="#6B655D">products favored</text>
  <text x="340" y="288" text-anchor="middle" fill="#6B655D">reactants favored</text>
</svg>
