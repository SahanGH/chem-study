  </g>
  <g fill="#FDFCF9" stroke="#4F706C" stroke-width="2.5">
    <circle cx="25.8" cy="80.3" r="7.75"/>
  </g>
  <text x="82" y="234" text-anchor="middle" fill="#26231F">19 A, 1 B</text>
  <text x="82" y="258" text-anchor="middle" fill="#26231F"><tspan font-style="italic">K</tspan> = 0.053</text>

  <!-- C to D: 8 C (filled), 12 D (open) -->
  <text x="213" y="52" text-anchor="middle" fill="#26231F" font-weight="600">C</text>
  <path d="M227 42.5H253l-6 -5.5M253 48.5H227l6 5.5" fill="none" stroke="#26231F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="267" y="52" text-anchor="middle" fill="#26231F" font-weight="600">D</text>
  <rect x="166" y="62" width="148" height="148" rx="8" fill="none" stroke="#6B655D" stroke-width="1.5"/>
