<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="system-ui, sans-serif" font-size="18">
  <!-- Three different made-up reactions, each at equilibrium in its own box: A to B (19 A, 1 B), C to D (8 C, 12 D), E to F (1 E, 19 F). Every box holds exactly 20 circles of the same outer size (radius 9). Reactant: filled ink circle. Product: open circle with an accent outline. Positions come from scratchpad/unit7/w75/three-mixtures.cjs (seeded dart-throwing): centers at least 25 apart, so no two circles touch, and at least 15 from a wall. The equilibrium arrows are drawn as paths, so they do not depend on a font having the character. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="270" fill="#FDFCF9"/>

  <!-- Key -->
  <circle cx="131" cy="20" r="9" fill="#26231F"/>
  <text x="148" y="26" fill="#26231F">reactant</text>
  <circle cx="281" cy="20" r="7.75" fill="#FDFCF9" stroke="#4F706C" stroke-width="2.5"/>
  <text x="298" y="26" fill="#26231F">product</text>

  <!-- A to B: 19 A (filled), 1 B (open) -->
  <text x="55" y="52" text-anchor="middle" fill="#26231F" font-weight="600">A</text>
  <path d="M69 42.5H95l-6 -5.5M95 48.5H69l6 5.5" fill="none" stroke="#26231F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="109" y="52" text-anchor="middle" fill="#26231F" font-weight="600">B</text>
  <rect x="8" y="62" width="148" height="148" rx="8" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <g fill="#26231F">
    <circle cx="78" cy="80.1" r="9"/>
    <circle cx="52" cy="82.4" r="9"/>
    <circle cx="126" cy="82.4" r="9"/>
    <circle cx="37.7" cy="103.7" r="9"/>
    <circle cx="64.8" cy="105.8" r="9"/>
    <circle cx="98.1" cy="112.8" r="9"/>
