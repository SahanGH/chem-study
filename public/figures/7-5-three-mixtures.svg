  </g>
  <text x="398" y="234" text-anchor="middle" fill="#26231F">1 E, 19 F</text>
  <text x="398" y="258" text-anchor="middle" fill="#26231F"><tspan font-style="italic">K</tspan> = 19</text>
</svg>
