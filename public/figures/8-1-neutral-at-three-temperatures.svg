<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="system-ui, sans-serif" font-size="18">
  <!-- A bar chart with a linear vertical scale: zero at y = 290 and 12 units for each 1 x 10^-8 M, so y = 290 - 12c for a concentration of c x 10^-8 M (0, 5, 10, 15, 20 at y = 290, 230, 170, 110, 50). Pure water: at 10 °C both ions are 5.39 x 10^-8 M (5.39 x 12 = 64.7, drawn 65 tall, top y = 225); at 25 °C both are 10.0 x 10^-8 M (120 tall, top y = 170); at 40 °C both are 17.0 x 10^-8 M (204 tall, top y = 86). Pair centers at x = 160, 280 and 400; each bar is 36 wide and the two of a pair touch. Left bar H3O+ (plain fill), right bar OH- (hatched). -->
  <defs>
    <pattern id="hatch-8-1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FDFCF9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6B655D" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="480" height="360" fill="#FDFCF9"/>

  <text x="20" y="28" fill="#26231F">Concentration (10<tspan dy="-7">&#8722;8</tspan><tspan dy="7"> M)</tspan></text>

  <!-- The key. -->
  <rect x="300" y="14" width="18" height="18" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <text x="324" y="30" fill="#26231F">H<tspan dy="5">3</tspan><tspan dy="-5">O</tspan><tspan dy="-7">+</tspan></text>
  <rect x="392" y="14" width="18" height="18" fill="url(#hatch-8-1)" stroke="#26231F" stroke-width="1.5"/>
  <text x="416" y="30" fill="#26231F">OH<tspan dy="-7">&#8722;</tspan></text>

  <!-- The bars. -->
  <rect x="124" y="225" width="36" height="65" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <rect x="160" y="225" width="36" height="65" fill="url(#hatch-8-1)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="244" y="170" width="36" height="120" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <rect x="280" y="170" width="36" height="120" fill="url(#hatch-8-1)" stroke="#26231F" stroke-width="1.5"/>
  <rect x="364" y="86" width="36" height="204" fill="#E3EAE9" stroke="#26231F" stroke-width="1.5"/>
  <rect x="400" y="86" width="36" height="204" fill="url(#hatch-8-1)" stroke="#26231F" stroke-width="1.5"/>

  <!-- The axis and its scale. -->
  <line x1="80" y1="290" x2="80" y2="50" stroke="#26231F" stroke-width="2"/>
  <line x1="80" y1="290" x2="460" y2="290" stroke="#26231F" stroke-width="2"/>
  <g stroke="#26231F" stroke-width="2">
    <line x1="73" y1="290" x2="80" y2="290"/>
    <line x1="73" y1="230" x2="80" y2="230"/>
    <line x1="73" y1="170" x2="80" y2="170"/>
    <line x1="73" y1="110" x2="80" y2="110"/>
    <line x1="73" y1="50" x2="80" y2="50"/>
  </g>
  <g fill="#26231F" text-anchor="end">
    <text x="66" y="296">0</text>
    <text x="66" y="236">5</text>
    <text x="66" y="176">10</text>
    <text x="66" y="116">15</text>
    <text x="66" y="56">20</text>
  </g>

  <g fill="#26231F" text-anchor="middle">
    <text x="160" y="314">10 °C</text>
    <text x="160" y="340">pH 7.27</text>
    <text x="280" y="314">25 °C</text>
    <text x="280" y="340">pH 7.00</text>
    <text x="400" y="314">40 °C</text>
    <text x="400" y="340">pH 6.77</text>
  </g>
</svg>
