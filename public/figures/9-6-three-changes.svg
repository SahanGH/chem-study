  <!-- The three changes in dissolving a salt. Three boxes, 140 by 150: x 15-155, 170-310, 325-465; y 44-194.
       Box 1: a block of 3 cations (radius 9) and 3 anions (radius 13), neighbors 22 apart so that they touch (9 + 13), plus 1 cation and 1 anion that have left: 4 and 4.
       A water molecule with its oxygen at (x, y) and direction phi has its hydrogens at (x + 11 cos(phi +/- 52), y + 11 sin(phi +/- 52)), y downward; hydrogens are drawn first.
       Box 2: six oxygens 44 from the center (240, 119), at 0, 60, ... 300 degrees, with phi 200, 100, 350, 250, 130, 30.
       Box 3: six oxygens 40 from the cation at (395, 119), at 30, 90, ... 330 degrees, phi equal to that angle, so each oxygen faces the ion.
       Each dotted line runs from the ion's edge (12 out) to the oxygen's edge (40 - 8 = 32 out): 20 long. -->
