<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="system-ui, sans-serif" font-size="18">
  <!-- 20.0 mL of 0.120 M H2A, a made-up acid with pKa1 = 3.00 and pKa2 = 8.00, titrated with 0.200 M NaOH. Plot area: x = 70 + volume * 380 / 36 (0 to 36 mL), y = 330 - pH * 300 / 14 (pH 0 at y = 330, pH 14 at y = 30). Examples: 6.0 mL, pH 3.02 gives x = 70 + 63.3 = 133.3, y = 330 - 64.7 = 265.3; 18.0 mL, pH 8.00 gives x = 70 + 190 = 260.0, y = 330 - 171.4 = 158.6; the rises are at 12.0 mL (x = 196.7) and 24.0 mL (x = 323.3). The curve is a polyline through the points of the lesson's plan (every 1 mL, and every 0.1 mL from 11.0 to 13.0 and from 23.0 to 25.0 mL), computed from the charge balance with the ionization of water included. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
