<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="system-ui, sans-serif" font-size="18">
  <!-- Top: gluconic acid, C6H12O7, with every bond. Carbon atoms C6 to C1 at x = 60, 110, 160, 210, 260, 310 on y = 110 (50 apart). Each of the first five has an H at y = 60, an O at y = 160 and that O's H at y = 210; C6 has one more H at (10, 110). C1 has a double-bonded O at (310, 55) and an O at (360, 110) whose H is at (410, 110). A letter's baseline is 6.5 below its center. A bond stops 12 short of each center (50 - 12 - 12 = 26 long; the C=O bond runs y = 67 to 98); a double bond is two lines 6 apart (x = 307 and 313). The ringed H: circle r = 15 at (410, 110); its bond runs x = 372 to 393. Count: 6 C, 12 H, 7 O.
       Bottom: the -COO(-) end of the gluconate ion twice, the second 240 to the right. Left form: C (136, 330), O (136, 275) double (x = 133 and 139, y = 287 to 318), O (196, 330) single (x = 148 to 184), minus at (214, 318). Right form: C (376, 330), O (376, 275) single with minus at (394, 263), O (436, 330) double (y = 327 and 333, x = 388 to 424). Arrow x = 229 to 258 at y = 330. -->
  <rect width="480" height="400" fill="#FDFCF9"/>

  <!-- Gluconic acid. -->
