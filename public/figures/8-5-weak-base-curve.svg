<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="system-ui, sans-serif" font-size="18">
  <!-- 30.0 mL of 0.100 M methylamine titrated with 0.150 M HNO3. Plot area: x = 70 + volume * 380 / 30 (0 to 30 mL), y = 330 - pH * 300 / 14 (pH 0 at y = 330, pH 14 at y = 30). Examples: 10.0 mL, pH 10.63 gives x = 70 + 126.7 = 196.7, y = 330 - 227.8 = 102.2; 20.0 mL, pH 5.93 gives x = 70 + 253.3 = 323.3, y = 330 - 127.1 = 202.9; pH 7 is y = 330 - 150 = 180. The curve is a polyline through the points of the lesson's plan (every 1 mL, and every 0.1 mL from 19.0 to 21.0 mL), computed from the full equation with pKa of CH3NH3+ = 10.64. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="400" fill="#FDFCF9"/>

  <path d="M70 30V330H450" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M70 330h-7M70 180h-7M70 30h-7" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M70 330v7M196.7 330v7M323.3 330v7M450 330v7" fill="none" stroke="#26231F" stroke-width="1.5"/>

  <text x="60" y="336" text-anchor="end" fill="#6B655D">0</text>
  <text x="60" y="186" text-anchor="end" fill="#6B655D">7</text>
  <text x="60" y="36" text-anchor="end" fill="#6B655D">14</text>
  <text x="28" y="186" text-anchor="middle" fill="#26231F">pH</text>

  <text x="70" y="358" text-anchor="middle" fill="#6B655D">0</text>
  <text x="196.7" y="358" text-anchor="middle" fill="#6B655D">10</text>
  <text x="323.3" y="358" text-anchor="middle" fill="#6B655D">20</text>
  <text x="450" y="358" text-anchor="middle" fill="#6B655D">30</text>
  <text x="260" y="388" text-anchor="middle" fill="#26231F">HNO₃ added (mL)</text>

  <path d="M70 180H450" fill="none" stroke="#6B655D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M196.7 109.2V330M323.3 210.9V330" fill="none" stroke="#6B655D" stroke-width="1.5" stroke-dasharray="4 4"/>

  <polyline points="70.0,77.0 82.7,80.9 95.3,84.4 108.0,87.4 120.7,90.1 133.3,92.5 146.0,94.6 158.7,96.6 171.3,98.5 184.0,100.4 196.7,102.2 209.3,104.0 222.0,105.9 234.7,107.9 247.3,110.0 260.0,112.3 272.7,115.0 285.3,118.2 298.0,122.5 310.7,129.5 311.9,130.5 313.2,131.6 314.5,132.9 315.7,134.4 317.0,136.2 318.3,138.3 319.5,141.0 320.8,144.8 322.1,151.3 323.3,202.9 324.6,254.5 325.9,260.9 327.1,264.7 328.4,267.3 329.7,269.4 330.9,271.1 332.2,272.5 333.5,273.7 334.7,274.8 336.0,275.8 348.7,282.0 361.3,285.6 374.0,288.1 386.7,290.0 399.3,291.6 412.0,292.8 424.7,293.9 437.3,294.8 450.0,295.7" fill="none" stroke="#26231F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="196.7" cy="102.2" r="7" fill="#FDFCF9" stroke="#26231F" stroke-width="2"/>
  <path d="M323.3 194.9L331.3 202.9L323.3 210.9L315.3 202.9Z" fill="#26231F"/>

  <text x="206" y="44" fill="#26231F">Halfway</text>
  <text x="206" y="66" fill="#26231F">pH = pKa = 10.64</text>
  <text x="338" y="216" fill="#26231F">Equivalence</text>
  <text x="338" y="238" fill="#26231F">pH 5.93</text>
</svg>
