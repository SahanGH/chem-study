<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 236" font-family="system-ui, sans-serif" font-size="18">
  <!-- A number line for Q, with K marked by a tall tick at its middle (x=240). Left of K: a filled circle (Q < K) with a thick arrow pointing right, toward K. Right of K: an open square (Q > K) with a thick arrow pointing left, toward K. The two markers are 170 units either side of the tick, and each arrow stops 22 units short of it. The markers differ in shape and shading as well as position. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="236" fill="#FDFCF9"/>

  <!-- The number line, with its arrowhead and label at the right end. -->
  <path d="M20 110H452" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M452 104L464 110L452 116Z" fill="#26231F"/>
  <text x="457" y="142" text-anchor="middle" fill="#26231F" font-style="italic">Q</text>

  <!-- K: a tall tick. It runs down between the two side labels to its own label. -->
  <path d="M240 78V178" fill="none" stroke="#26231F" stroke-width="2.5"/>
  <text x="240" y="66" text-anchor="middle" fill="#26231F" font-style="italic" font-weight="600">K</text>

  <!-- Q less than K: filled circle, arrow to the right. -->
  <path d="M84 110H200" fill="none" stroke="#4F706C" stroke-width="5"/>
  <path d="M198 99L218 110L198 121Z" fill="#4F706C"/>
  <circle cx="70" cy="110" r="9" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
  <text x="70" y="86" text-anchor="middle" fill="#26231F"><tspan font-style="italic">Q</tspan> &lt; <tspan font-style="italic">K</tspan></text>
  <text x="134" y="150" text-anchor="middle" fill="#26231F">runs toward</text>
  <text x="134" y="172" text-anchor="middle" fill="#26231F">products</text>

  <!-- Q greater than K: open square, arrow to the left. -->
  <path d="M396 110H280" fill="none" stroke="#4F706C" stroke-width="5"/>
  <path d="M282 99L262 110L282 121Z" fill="#4F706C"/>
  <rect x="401" y="101" width="18" height="18" fill="#FDFCF9" stroke="#26231F" stroke-width="2.5"/>
  <text x="410" y="86" text-anchor="middle" fill="#26231F"><tspan font-style="italic">Q</tspan> &gt; <tspan font-style="italic">K</tspan></text>
  <text x="346" y="150" text-anchor="middle" fill="#26231F">runs toward</text>
  <text x="346" y="172" text-anchor="middle" fill="#26231F">reactants</text>

  <!-- At K itself. -->
  <text x="240" y="202" text-anchor="middle" fill="#26231F"><tspan font-style="italic">Q</tspan> = <tspan font-style="italic">K</tspan></text>
  <text x="240" y="224" text-anchor="middle" fill="#26231F">equilibrium</text>
</svg>
