<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" font-family="system-ui, sans-serif" font-size="18">
  <!-- Two boxes of the same size on the lesson's scale, one formula unit for each 0.05 M. Left, 0.10 M MgCl2: 2 Mg2+ and 4 Cl-. Right, 0.20 M MgCl2: 4 Mg2+ and 8 Cl-. Each box is neutral. No two ions touch; water is not drawn. -->
  <defs>
    <g id="mg">
      <circle r="17" fill="#4F706C" stroke="#26231F" stroke-width="1.5"/>
      <text y="6.5" text-anchor="middle" fill="#FDFCF9">Mg</text>
      <text x="16" y="-10" fill="#26231F" font-size="18">2+</text>
    </g>
    <g id="cl">
      <circle r="21" fill="#4F706C" fill-opacity="0.4" stroke="#26231F" stroke-width="1.5"/>
      <text y="6.5" text-anchor="middle" fill="#26231F">Cl</text>
      <text x="18" y="-12" fill="#26231F" font-size="18">&#8722;</text>
    </g>
  </defs>
  <rect width="480" height="276" fill="#FDFCF9"/>

  <text x="121" y="28" text-anchor="middle" fill="#26231F" font-weight="600">0.10 M MgCl<tspan dy="4" font-size="14">2</tspan></text>
  <rect x="8" y="40" width="226" height="226" rx="10" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <use href="#mg" x="185" y="72"/>
  <use href="#cl" x="38" y="74"/>
  <use href="#mg" x="104" y="145"/>
  <use href="#cl" x="189" y="158"/>
  <use href="#cl" x="197" y="227"/>
  <use href="#cl" x="53" y="232"/>

  <text x="359" y="28" text-anchor="middle" fill="#26231F" font-weight="600">0.20 M MgCl<tspan dy="4" font-size="14">2</tspan></text>
  <rect x="246" y="40" width="226" height="226" rx="10" fill="none" stroke="#6B655D" stroke-width="1.5"/>
  <use href="#cl" x="349" y="71"/>
  <use href="#cl" x="431" y="71"/>
  <use href="#mg" x="273" y="72"/>
  <use href="#cl" x="275" y="126"/>
  <use href="#mg" x="339" y="128"/>
  <use href="#mg" x="406" y="129"/>
  <use href="#cl" x="433" y="177"/>
  <use href="#cl" x="298" y="179"/>
  <use href="#cl" x="364" y="182"/>
  <use href="#cl" x="276" y="237"/>
  <use href="#cl" x="409" y="237"/>
  <use href="#mg" x="328" y="241"/>
</svg>
