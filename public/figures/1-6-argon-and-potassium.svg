<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 468" font-family="system-ui, sans-serif" font-size="18">
  <!-- Two photoelectron spectra on one energy axis. The horizontal axis is logarithmic: 1000 MJ/mol at x=72 and 0.1 MJ/mol at x=452, 95 units per decade, so a binding energy E is at x = 72 + 95 x (3 - log10 E). Both panels use the same x positions. In each panel a peak is 24 units tall for each electron. Upper panel, argon, zero at y=180: 1s 309 MJ/mol, 2 electrons, x=120.45, height 48 (top at y=132); 2s 31.5 MJ/mol, 2 electrons, x=214.66, height 48 (top at y=132); 2p 24.1 MJ/mol, 6 electrons, x=225.71, height 144 (top at y=36); 3s 2.82 MJ/mol, 2 electrons, x=314.23, height 48 (top at y=132); 3p 1.52 MJ/mol, 6 electrons, x=339.72, height 144 (top at y=36). Lower panel, potassium, zero at y=399: 1s 347 MJ/mol, 2 electrons, x=115.67, height 48 (top at y=351); 2s 37.1 MJ/mol, 2 electrons, x=207.91, height 48 (top at y=351); 2p 29.1 MJ/mol, 6 electrons, x=217.93, height 144 (top at y=255); 3s 3.93 MJ/mol, 2 electrons, x=300.53, height 48 (top at y=351); 3p 2.38 MJ/mol, 6 electrons, x=321.23, height 144 (top at y=255); 4s 0.42 MJ/mol, 1 electrons, x=392.79, height 24 (top at y=375). Peaks are 4 wide with a rounded top, centered on the binding energy. A dashed line drops from the center of each argon peak to potassium's axis, in short dashes from the s peaks and long dashes from the p peaks; the lines from 2s and 2p pause where potassium's 2p label stands between them. Font size 18 keeps text at 12 px when the figure is 320 px wide. -->
  <rect width="480" height="468" fill="#FDFCF9"/>

  <!-- Upper panel: argon. Its axis has the same marks as the lower one, without numbers. -->
  <path d="M72 26V180.75H452" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M72 180.75v5M167 180.75v5M262 180.75v5M357 180.75v5M452 180.75v5" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M72 132h-7M72 84h-7M72 36h-7" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="62" y="138" text-anchor="end" fill="#6B655D">2</text>
  <text x="62" y="90" text-anchor="end" fill="#6B655D">4</text>
  <text x="62" y="42" text-anchor="end" fill="#6B655D">6</text>
  <text x="20" y="108" text-anchor="middle" fill="#26231F" transform="rotate(-90 20 108)">Relative number</text>
  <text x="42" y="108" text-anchor="middle" fill="#26231F" transform="rotate(-90 42 108)">of electrons</text>

  <!-- Lower panel: potassium. -->
  <path d="M72 245V399.75H452" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M72 399.75v7M167 399.75v7M262 399.75v7M357 399.75v7M452 399.75v7" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <path d="M72 351h-7M72 303h-7M72 255h-7" fill="none" stroke="#26231F" stroke-width="1.5"/>
  <text x="62" y="357" text-anchor="end" fill="#6B655D">2</text>
  <text x="62" y="309" text-anchor="end" fill="#6B655D">4</text>
  <text x="62" y="261" text-anchor="end" fill="#6B655D">6</text>
  <text x="20" y="327" text-anchor="middle" fill="#26231F" transform="rotate(-90 20 327)">Relative number</text>
  <text x="42" y="327" text-anchor="middle" fill="#26231F" transform="rotate(-90 42 327)">of electrons</text>
  <text x="72" y="425" text-anchor="middle" fill="#6B655D">1000</text>
  <text x="167" y="425" text-anchor="middle" fill="#6B655D">100</text>
  <text x="262" y="425" text-anchor="middle" fill="#6B655D">10</text>
  <text x="357" y="425" text-anchor="middle" fill="#6B655D">1</text>
  <text x="452" y="425" text-anchor="middle" fill="#6B655D">0.1</text>
  <text x="262" y="453" text-anchor="middle" fill="#26231F">Binding energy (MJ/mol)</text>

  <!-- Dashed lines from argon's peaks, each named where it enters the lower panel. -->
  <path d="M120.45 182.5V398M214.66 182.5V230M214.66 254V398M314.23 182.5V398" fill="none" stroke="#6B655D" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M225.71 182.5V230M225.71 254V398M339.72 182.5V398" fill="none" stroke="#6B655D" stroke-width="1" stroke-dasharray="10 4"/>
  <text x="125.45" y="210" fill="#6B655D">1s</text>
  <text x="209.66" y="210" text-anchor="end" fill="#6B655D">2s</text>
  <text x="230.71" y="210" fill="#6B655D">2p</text>
  <text x="309.23" y="210" text-anchor="end" fill="#6B655D">3s</text>
  <text x="344.72" y="210" fill="#6B655D">3p</text>

  <path d="M118.45 180V134A2 2 0 0 1 122.45 134V180Z" fill="#4F706C"/>
  <path d="M212.66 180V134A2 2 0 0 1 216.66 134V180Z" fill="#4F706C"/>
  <path d="M223.71 180V38A2 2 0 0 1 227.71 38V180Z" fill="#4F706C"/>
  <path d="M312.23 180V134A2 2 0 0 1 316.23 134V180Z" fill="#4F706C"/>
  <path d="M337.72 180V38A2 2 0 0 1 341.72 38V180Z" fill="#4F706C"/>
  <path d="M113.67 399V353A2 2 0 0 1 117.67 353V399Z" fill="#4F706C"/>
  <path d="M205.91 399V353A2 2 0 0 1 209.91 353V399Z" fill="#4F706C"/>
  <path d="M215.93 399V257A2 2 0 0 1 219.93 257V399Z" fill="#4F706C"/>
  <path d="M298.53 399V353A2 2 0 0 1 302.53 353V399Z" fill="#4F706C"/>
  <path d="M319.23 399V257A2 2 0 0 1 323.23 257V399Z" fill="#4F706C"/>
  <path d="M390.79 399V377A2 2 0 0 1 394.79 377V399Z" fill="#4F706C"/>

  <text x="120.45" y="125" text-anchor="middle" fill="#26231F">1s</text>
  <text x="216.66" y="125" text-anchor="end" fill="#26231F">2s</text>
  <text x="225.71" y="29" text-anchor="middle" fill="#26231F">2p</text>
  <text x="314.23" y="125" text-anchor="middle" fill="#26231F">3s</text>
  <text x="339.72" y="29" text-anchor="middle" fill="#26231F">3p</text>
  <text x="117.67" y="344" text-anchor="end" fill="#26231F">1s</text>
  <text x="209.91" y="344" text-anchor="end" fill="#26231F">2s</text>
  <text x="217.93" y="248" text-anchor="middle" fill="#26231F">2p</text>
  <text x="300.53" y="344" text-anchor="middle" fill="#26231F">3s</text>
  <text x="326.98" y="248" text-anchor="middle" fill="#26231F">3p</text>
  <text x="399" y="368" text-anchor="middle" fill="#26231F">4s: new peak</text>

  <text x="362" y="66" fill="#26231F">Argon,</text>
  <text x="362" y="88" fill="#26231F">18 protons</text>
  <text x="362" y="282" fill="#26231F">Potassium,</text>
  <text x="362" y="304" fill="#26231F">19 protons</text>
</svg>
